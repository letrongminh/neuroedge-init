# Target `sim` — the browser simulator. No hardware purchase required, which is
# what makes the sub-10-minute time-to-first-value claim (A1) possible.
#
# Capabilities deliberately mirror esp32s3-box-3 rather than exceeding it: if
# `sim` offered more, an agent could pass in simulation and fail to build for
# the reference board, and target equivalence would be worthless.

schema = "neuroedge.board/v1"

[board]
id     = "sim-default"
name   = "NeuroEdge Web Simulator"
target = "sim"
mcu    = "none"

[capabilities.audio_in]
channels       = 1
sample_rate_hz = 16000
aec            = true
vad            = true

[capabilities.audio_out]
channels       = 1
sample_rate_hz = 16000

[capabilities.digital_out]
pins    = ["door_lock", "porch_light", "gate_relay"]
backend = "virtual"

# Safety envelope per pin (RFC-0007 §3d): every digital.out pin is an actuator and needs
# one. Wide enough that the canonical traces replay unchanged (door_lock pulses 30 s).
[capabilities.digital_out.envelope.door_lock]
window_s             = 3600
max_on_ms_per_window = 600000
min_interval_ms      = 1000
max_continuous_ms    = 60000

[capabilities.digital_out.envelope.porch_light]
window_s             = 3600
max_on_ms_per_window = 1800000
min_interval_ms      = 2000
max_continuous_ms    = 600000

[capabilities.digital_out.envelope.gate_relay]
window_s             = 3600
max_on_ms_per_window = 600000
min_interval_ms      = 1000
max_continuous_ms    = 60000

[capabilities.sensor_read]
sensors = ["temperature", "humidity", "door_contact", "motion"]

[capabilities.display]
width  = 320
height = 240
color  = "rgb565"
