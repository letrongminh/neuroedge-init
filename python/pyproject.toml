[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroedge"
version = "0.1.0"
description = "Typed Action Contract Platform for Physical AI"
# The PyPI page is the repository's root README.md, read in by hatch_build.py.
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
# python/LICENSE is a byte-for-byte copy of the root LICENSE: hatchling takes
# licence files only from inside python/. tests/test_packaging.py keeps them equal.
license-files = ["LICENSE"]
authors = [
    { name = "NeuroEdge Contributors", email = "minh.letrong.vn@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies of the distributed core. Every entry must carry a
# permissive licence: the core is MIT, and §3.10 warns that strong copyleft
# here would spread into customer projects. The `format-nongpl` extra on
# jsonschema is deliberate — its default `format` extra pulls in the
# GPL-licensed rfc3987, whereas `format-nongpl` uses the MIT rfc3987-syntax.
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jsonschema[format-nongpl]>=4.21.0",
    "pyyaml>=6.0.1",
    "rfc8785>=0.1.2",
    "deepdiff>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pip-licenses>=5.0.0",
    "mcp>=2.2",  # so the MCP server is tested in CI (no test may skip)
    "pyserial==3.5",  # so the serial path of `record --port` is tested in CI
]
# `neuroedge mcp serve` (Q-24): the official MCP Python SDK. MIT, and every
# transitive dependency MIT/BSD/Apache-2.0/PSF (checked 2026-09-23, NOTICE §B).
mcp = [
    "mcp>=2.2",
]
# System 2 on a real cloud model (TSK-S2-11, Q-10): LiteLLM as a library, never
# its proxy, only behind neuroedge.models.providers. Pinned exactly as approved
# in Q-11: litellm 1.102.0 is MIT and its wheel has no enterprise/ directory;
# every transitive licence must be on the Q-11 allowlist (neuroedge-prd.md §15) —
# the CI job `cloud-extra` fails on any other (NOTICE §B). ~120 MB installed, so
# never in `dev`: tests use a fake `litellm` module.
cloud = [
    "litellm==1.102.0",
]
# `neuroedge record --target esp32s3 --port /dev/tty…` (TSK-S4-09): reading the
# board's UART. BSD-3-Clause, no dependencies. Files and tcp:// (QEMU) need nothing.
serial = [
    "pyserial==3.5",
]
# Target `linux` (TSK-S3-05): the libgpiod v2 Python bindings, imported at run
# time by neuroedge.hal.linux. LGPL-2.1-or-later, so optional and never in the
# core set; the licence gate in CI installs `dev` only. See NOTICE §B.
linux = [
    "gpiod>=2.2",
]

[project.urls]
Homepage = "https://github.com/letrongminh/neuroedge-init"
Source = "https://github.com/letrongminh/neuroedge-init"
Issues = "https://github.com/letrongminh/neuroedge-init/issues"
Changelog = "https://github.com/letrongminh/neuroedge-init/blob/main/CHANGELOG.md"

[project.scripts]
neuroedge = "neuroedge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["neuroedge"]

# Copies schemas/, boards/, gates/ and the canonical fixtures into
# neuroedge/_data/ for both the sdist and the wheel (TSK-S3-17, hatch_build.py).
[tool.hatch.build.hooks.custom]

# Fills the dynamic `readme` from the root README.md (TSK-S3-20, hatch_build.py).
[tool.hatch.metadata.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # pyupgrade
    "C4",     # comprehensions
    "SIM",    # simplify
    "RET",    # return
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # Typer declares defaults via function calls in signatures
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately assert on private-ish shapes and repeat fixtures.
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
