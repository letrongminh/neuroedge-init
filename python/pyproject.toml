[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroedge"
version = "0.1.0"
description = "Typed Action Contract Platform for Physical AI"
readme = "../neuroedge-proposal.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NeuroEdge Team", email = "engineering@neuroedge.dev" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jsonschema>=4.21.0",
    "canonicaljson>=2.0.0",
    "copier>=9.0.0",
    "deepdiff>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
neuroedge = "neuroedge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["neuroedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
