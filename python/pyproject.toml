[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroedge"
version = "0.1.0"
description = "Typed Action Contract Platform for Physical AI"
# The PyPI page is the repository's root README.md, read in by hatch_build.py.
dynamic = ["readme"]
requires-python = ">=3.11"
# Q-45: the code is PolyForm Noncommercial 1.0.0; the schemas shipped in the wheel
# (and the spec and conformance suite) stay open under Apache-2.0 — LICENSING.md.
license = "PolyForm-Noncommercial-1.0.0 AND Apache-2.0"
# python/LICENSE and python/LICENSES/ are byte-for-byte copies of the root files:
# hatchling takes licence files only from inside python/. tests/test_packaging.py
# keeps them equal.
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt"]
authors = [
    { name = "NeuroEdge Contributors", email = "minh.letrong.vn@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies of the distributed core. Every entry must carry a
# permissive licence: strong copyleft here would conflict with the core's
# licence (Q-45) and spread into customer projects (§3.10). The `format-nongpl` extra on
# jsonschema is deliberate — its default `format` extra pulls in the
# GPL-licensed rfc3987, whereas `format-nongpl` uses the MIT rfc3987-syntax.
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jsonschema[format-nongpl]>=4.21.0",
    "pyyaml>=6.0.1",
    "rfc8785>=0.1.2",
    "deepdiff>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pip-licenses>=5.0.0",
    "mcp>=2.2",  # so the MCP server is tested in CI (no test may skip)
    "pyserial==3.5",  # so the serial path of `record --port` is tested in CI
    # The openWakeWord adapter takes samples as numpy int16 arrays, and the wake
    # tests model that contract; openWakeWord itself is never installed in CI.
    "numpy>=2.0",
]
# `neuroedge mcp serve` (Q-24): the official MCP Python SDK. MIT, and every
# transitive dependency MIT/BSD/Apache-2.0/PSF (checked 2026-09-23, NOTICE §B).
mcp = [
    "mcp>=2.2",
]
# System 2 on a real cloud model (TSK-S2-11, Q-10): LiteLLM as a library, never
# its proxy, only behind neuroedge.models.providers. Pinned exactly as approved
# in Q-11: litellm 1.102.0 is MIT and its wheel has no enterprise/ directory;
# every transitive licence must be on the Q-11 allowlist (neuroedge-prd.md §15) —
# the CI job `cloud-extra` fails on any other (NOTICE §B). ~120 MB installed, so
# never in `dev`: tests use a fake `litellm` module.
cloud = [
    "litellm==1.102.0",
]
# `neuroedge record --target esp32s3 --port /dev/tty…` (TSK-S4-09): reading the
# board's UART. BSD-3-Clause, no dependencies. Files and tcp:// (QEMU) need nothing.
serial = [
    "pyserial==3.5",
]
# Target `linux` (TSK-S3-05): the libgpiod v2 Python bindings, imported at run
# time by neuroedge.hal.linux. LGPL-2.1-or-later, so optional and never in the
# core set; the licence gate in CI installs `dev` only. See NOTICE §B.
linux = [
    "gpiod>=2.2",
]
# Target `linux`, live audio (TSK-S5-08, Q-22): sounddevice (PortAudio, MIT),
# imported only when the live backend is chosen (`NEUROEDGE_LINUX_AUDIO=live`,
# the PipeWire echo-cancel nodes). A `--voice-file` session needs nothing; the
# core set stays sounddevice-free (see NOTICE §B). Not in `dev`: the tests use a
# fake sounddevice module.
audio = [
    "sounddevice>=0.5.1",
]
# Wake word `[wake_word]` with provider = "openwakeword" (TSK-I4-01, Q-7):
# openWakeWord's code is Apache-2.0, but every model it publishes is CC BY-NC-SA
# 4.0 or of unestablished licence — none may ship with NeuroEdge and its downloader
# must never run (Q-45). All three model files (`model`, `melspectrogram`,
# `embedding`) are the user's; 0.6.0 is required because 0.5.1 bundles NC models in
# its wheel, while 0.6.0 ships none. Inference is onnx: tflite-runtime has no Linux
# wheels for the Python versions supported here, so onnxruntime comes with it.
# Imported only when that provider is chosen. Not in `dev`: the tests drive a fake
# openwakeword module (see NOTICE §B).
wake = [
    "openwakeword>=0.6.0",
    "onnxruntime>=1.20",
]

[project.urls]
Homepage = "https://github.com/letrongminh/neuroedge-init"
Source = "https://github.com/letrongminh/neuroedge-init"
Issues = "https://github.com/letrongminh/neuroedge-init/issues"
Changelog = "https://github.com/letrongminh/neuroedge-init/blob/main/CHANGELOG.md"

[project.scripts]
neuroedge = "neuroedge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["neuroedge"]

# Copies schemas/, boards/, gates/ and the canonical fixtures into
# neuroedge/_data/ for both the sdist and the wheel (TSK-S3-17, hatch_build.py).
[tool.hatch.build.hooks.custom]

# Fills the dynamic `readme` from the root README.md (TSK-S3-20, hatch_build.py).
[tool.hatch.metadata.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # pyupgrade
    "C4",     # comprehensions
    "SIM",    # simplify
    "RET",    # return
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # Typer declares defaults via function calls in signatures
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately assert on private-ish shapes and repeat fixtures.
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
