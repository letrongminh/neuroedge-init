# Action CI — sim and linux (TSK-S1-12, FR-CI-05)
#
# Runs on every pull request and push. This is the gate that must be green
# before a merge.
#
# Ordering is deliberate: the frozen artifacts are checked before the code that
# consumes them, so a schema break reports as a schema break rather than as a
# pile of downstream test failures.
name: ci-sim-linux

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-sim-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Language-neutral assets live outside the Python package.
  NEUROEDGE_ROOT: ${{ github.workspace }}

jobs:
  frozen-artifacts:
    name: Frozen artifacts (schemas, gates, traces, boards)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: The seven schemas are valid JSON Schema draft 2020-12
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          expected = {
              "trace.v1.json": "https://schema.neuroedge.dev/trace/v1.json",
              "gate.v1.json": "https://schema.neuroedge.dev/gate/v1.json",
              "board.v1.json": "https://schema.neuroedge.dev/board/v1.json",
              "tool-call.v1.json": "https://schema.neuroedge.dev/tool-call/v1.json",
              "tool-result.v1.json": "https://schema.neuroedge.dev/tool-result/v1.json",
              "error.v1.json": "https://schema.neuroedge.dev/error/v1.json",
              "error-codes.v1.json": "https://schema.neuroedge.dev/error-codes/v1.json",
          }
          found = {p.name for p in pathlib.Path("schemas").glob("*.json")}
          if found != set(expected):
              sys.exit(f"schemas/ must hold exactly {sorted(expected)}, found {sorted(found)}")

          for name, schema_id in expected.items():
              schema = json.loads(pathlib.Path("schemas", name).read_text())
              Draft202012Validator.check_schema(schema)
              if schema["$id"] != schema_id:
                  sys.exit(f"{name}: $id is {schema['$id']!r}, expected {schema_id!r}")
              print(f"  ok  {name}  {schema_id}")
          PY

      - name: Canonical gates match digests.lock (TSK-S3-16)
        # Resolving proves a gate is safe to load, not that it is the gate that
        # was reviewed: an edited-but-valid gate resolves too. A new file needs
        # `--update`; a changed or deleted one needs an RFC (`--accept --rfc`).
        run: python scripts/check_digests.py --check

      - name: Every gate resolves (5 inheritance safety principles)
        run: neuroedge gate lint

      - name: The invalid gate corpus still fails
        run: |
          # An inverted assertion: if these ever resolve, the safety checks have
          # regressed, and a green pipeline would be actively misleading.
          #
          # The exit code is matched EXACTLY against 1 ("ran and failed"). A
          # looser `if ! cmd` would also accept 2 ("usage error") and so would
          # keep passing if this invocation were ever mistyped — the command
          # would never run, and nothing would notice.
          set +e
          neuroedge gate lint fixtures/gates/invalid --registry fixtures/gates/registry \
            > lint-invalid.log 2>&1
          status=$?
          set -e
          cat lint-invalid.log

          if [ "$status" -eq 0 ]; then
            echo "::error::fixtures/gates/invalid/ resolved successfully — inheritance safety checks have regressed"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit 1 (ran and failed) but got $status — the check did not actually run"
            exit 1
          fi
          echo "  ok  the counter-example corpus is still rejected (exit 1)"

      - name: The three canonical traces validate (FR-TRC-08, A7)
        run: neuroedge trace validate fixtures/traces/*.json

      - name: Board declarations and the full artifact sweep
        run: |
          neuroedge board list
          neuroedge verify --targets sim   # linux: the linux-hal job, on gpio-sim

  tests:
    name: Test suite (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        working-directory: python
        run: python -m pytest -q --strict-markers --junit-xml=../junit.xml

      - name: No test may be skipped
        # CONTRIBUTING.md §5. A test skipped for a missing dependency reads as a
        # pass in the summary line; Sprint 1 shipped a "4/4 passing" claim while
        # four schema conformance tests were silently skipping.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          suite = ET.parse("junit.xml").getroot()
          totals = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          for element in suite.iter("testsuite"):
              for key in totals:
                  totals[key] += int(element.get(key, 0))

          print(
              f"tests={totals['tests']} skipped={totals['skipped']} "
              f"failures={totals['failures']} errors={totals['errors']}"
          )
          if totals["skipped"]:
              names = [
                  case.get("name")
                  for case in suite.iter("testcase")
                  if case.find("skipped") is not None
              ]
              print(f"::error::{totals['skipped']} test(s) skipped: {names}")
              sys.exit(1)
          if totals["tests"] == 0:
              sys.exit("::error::no tests ran")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml

  linux-hal:
    name: Linux HAL on gpio-sim (TSK-S3-05, Q-16)
    # The HAL against real kernel GPIO lines, with no board: gpio-sim builds a
    # virtual chip whose lines carry the linux-rpi5 pin names. Then target
    # equivalence (A2): every canonical trace decides the same on sim and linux.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Virtual GPIO lines (gpio-sim)
        run: bash scripts/setup_gpio_sim.sh

      - name: A hwmon sensor (i2c-stub + lm75), an ADC (ads7828) and a framebuffer (vfb) — TSK-S5-09, TSK-I2a-04
        run: |
          bash scripts/setup_i2c_stub.sh
          bash scripts/setup_vfb.sh

      - name: A V4L2 capture device with no camera (vivid) — TSK-V1b-01
        # `vision.in` on linux runs against the kernel's virtual video driver: the same ioctls and
        # mmap buffers as a Pi's camera. A missing device here is a failure, never a skip.
        run: bash scripts/setup_vivid.sh

      - name: Install, with the optional linux extra (gpiod, LGPL-2.1)
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,linux]'

      - name: LinuxHAL against the kernel lines
        working-directory: python
        # A missing chip here is a failure, never a skip (Q-16).
        run: python -m pytest -q tests_linux --junit-xml=../junit-linux.xml

      - name: Target equivalence — sim and linux (A2)
        run: neuroedge verify --targets sim,linux

      - name: The brain's own OS user is kept apart from the box (TC-A-03-2, Q-83 DP-A-03)
        # Last: it remounts /proc with hidepid=2 and closes the device nodes to other users.
        run: bash scripts/brain_isolation.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-linux
          path: junit-linux.xml

  install-full:
    # Q-83 Profile A on a blank runner in one command (DP-A-09): `neuroedge install --profile
    # full` makes the users, keys and units, fetches the pinned NeuroClaw, and the brain then
    # turns the light on through the box over mTLS. The LLM is a stand-in (scripts/fake_llm.py);
    # Telegram is off — the brain is asked from its own command line.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: neuroedge in a venv the box's user can run
        run: |
          sudo python -m venv /opt/neuroedge
          sudo /opt/neuroedge/bin/python -m pip install --quiet './python[mcp]'
          sudo ln -sf /opt/neuroedge/bin/neuroedge /usr/local/bin/neuroedge

      - name: A stand-in LLM that calls the light tool
        run: |
          python3 scripts/fake_llm.py --port 18080 --tool living_light_on --log "$RUNNER_TEMP/llm.jsonl" &
          printf 'LLM_API_KEY=fake\nLLM_PROVIDER=openai\nLLM_MODEL=fake-model\nLLM_API_BASE=http://127.0.0.1:18080/v1\n' \
            > "$RUNNER_TEMP/brain.env"

      - name: One command installs box and brain (TC-A-09-1, TC-COM-07-1)
        run: |
          sudo /opt/neuroedge/bin/neuroedge install --profile full --allow shell \
            --agent fixtures/agents/chat-den-cua --target sim --env-file "$RUNNER_TEMP/brain.env" \
            | tee "$RUNNER_TEMP/install.log"
          for unit in neuroedge-hidepid neuroedge-box; do
            systemctl is-active --quiet "$unit" || { sudo journalctl -u "$unit" --no-pager | tail -30; exit 1; }
          done
          for _ in $(seq 1 60); do
            k=/var/lib/neuroclaw/keys
            code=$(sudo curl -s -o /dev/null -w '%{http_code}' --cacert "$k/ca.pem" --cert "$k/nao.pem" \
              --key "$k/nao.key" https://localhost:8443/mcp || true)
            [ "$code" = 401 ] && break
            sleep 1
          done
          [ "$code" = 401 ] || { sudo journalctl -u neuroedge-box --no-pager | tail -30; exit 1; }
          echo "  ok  the box answers on 8443 over mTLS and refuses a call without a token (401)"

      - name: The brain turns the light on through the box (TC-A-09-1)
        run: |
          sudo -u neuroclaw env NEUROCLAW_HOME=/var/lib/neuroclaw NEUROCLAW_CONFIG=/var/lib/neuroclaw/config.json \
            /var/lib/neuroclaw/bin/neuroclaw agent -m "turn on the living room light"
          grep -q '"chosen": "mcp_neuroedge_living_light_on"' "$RUNNER_TEMP/llm.jsonl"
          grep -q 'living_light_on.*ALLOW' "$RUNNER_TEMP/llm.jsonl" || { cat "$RUNNER_TEMP/llm.jsonl"; exit 1; }
          echo "  ok  the brain called the box's tool over mTLS and the gate allowed it"

      - name: The shell the owner turned on is a label, printed once and listed by status (TC-COM-06-2)
        run: |
          [ "$(grep -c 'risk=shell' "$RUNNER_TEMP/install.log")" = 1 ]
          sudo neuroedge status | tee "$RUNNER_TEMP/status.log"
          grep -qx 'risk=shell' "$RUNNER_TEMP/status.log"

      - name: The brain stays apart (TC-A-03-1 on the installed machine)
        run: sudo neuroedge doctor --brain-user neuroclaw --keys /var/lib/neuroedge/keys

      - name: Logs
        if: always()
        run: |
          sudo journalctl -u neuroedge-box -u neuroclaw -u neuroedge-hidepid --no-pager | tail -100
          cat "$RUNNER_TEMP/llm.jsonl" 2>/dev/null || true

  wheel-smoke:
    name: Installed wheel runs the whole journey (TSK-S3-17)
    # Every other job installs editable from the checkout, so a wheel missing
    # boards/, schemas/ or gates/ passes them all — measured 2026-09-23. This
    # builds sdist -> wheel (what PyPI users get), installs it into a clean venv
    # and runs new/build/run/record/replay/test/verify outside the repo.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEUROEDGE_ROOT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Stranger's journey on the installed wheel
        run: bash scripts/wheel_smoke.sh python

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        working-directory: python
        run: |
          ruff check .
          ruff format --check .

  licence-obligations:
    name: Licence obligations (§3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: NOTICE exists and dependency versions are pinned
        run: |
          test -s NOTICE || { echo "::error::NOTICE is missing or empty (§3.9 obligation 2)"; exit 1; }
          test -s python/requirements-lock.txt || {
            echo "::error::python/requirements-lock.txt is missing (§3.9 obligation 5)"; exit 1; }
          echo "  ok  NOTICE and the pinned dependency set are present"

      - name: No strong-copyleft dependency reaches the distributed core
        run: |
          # §3.10: GPLv3/AGPL code would conflict with the core's licence (Q-45)
          # and spread from the core into customer projects. Two real accidents
          # this guards against:
          #   * jsonschema's default [format] extra pulls in GPL rfc3987
          #     (hence [format-nongpl] in pyproject.toml);
          #   * copier pulls in jinja2-ansible-filters, which is GPL3 (hence
          #     `neuroedge new` uses a plain-Python generator, TSK-S3-07).
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e 'python[dev]' >/dev/null
          pip-licenses --format=csv > licences.csv
          cat licences.csv
          # `neuroedge` is the product, not a dependency: its own licence is Q-45.
          pip-licenses --partial-match --ignore-packages neuroedge --fail-on="GPL;GNU General Public License;GNU Affero General Public License;AGPL"
          echo "  ok  no strong-copyleft dependency found"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: licences
          path: licences.csv

  cloud-extra:
    name: Cloud extra — LiteLLM licences and the real library (TSK-S2-11, Q-11)
    # `neuroedge[cloud]` is litellm==1.102.0 and ~55 transitive packages (~120 MB),
    # never in `dev`, so the test suite uses a fake `litellm`. This job installs
    # the real extra, holds its whole dependency set to the Q-11 policy, and
    # drives the adapter on real LiteLLM response objects (mock_response: no
    # network, no key).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the cloud extra
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e 'python[cloud]' 'pip-licenses>=5.0.0'
          python -m pip show litellm | head -2

      - name: Transitive licences follow the Q-11 policy
        run: |
          # Forbidden families first, in the style of the licence-obligations job;
          # then every package must be MIT / BSD / Apache-2.0 / ISC / PSF / MPL-2.0 —
          # unknown and commercial licences fail too (scripts/check_licences.py).
          pip-licenses --format=csv > licences-cloud.csv
          cat licences-cloud.csv
          # `neuroedge` is the product: "Commercial" would match its own
          # "PolyForm-Noncommercial-1.0.0" (Q-45); check_licences.py skips it too.
          pip-licenses --partial-match --ignore-packages neuroedge --fail-on="GPL;GNU General Public License;GNU Lesser General Public License;GNU Affero General Public License;AGPL;SSPL;Server Side Public License;BUSL;Business Source License;Commercial;Proprietary"
          pip-licenses --format=json > licences-cloud.json
          python scripts/check_licences.py licences-cloud.json

      - name: The adapter on the real LiteLLM (offline, no key)
        run: python scripts/cloud_smoke.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: licences-cloud
          path: licences-cloud.csv

  ui-golden:
    name: LVGL device UI golden images (TSK-S4-10, Q-21)
    # The firmware's screen code rendered on the host: every screen x language
    # compared against the committed PNGs (scripts/run_ui_golden.sh). The same
    # container as firmware-qemu.yml holds the toolchain the goldens were
    # generated with (cmake 3.30, gcc 13), so this job checks the pinned bytes
    # rather than a second renderer. The script is also the local entry point.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every screen matches its golden in both languages
        run: |
          . "$IDF_PATH/export.sh"
          bash scripts/run_ui_golden.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ui-golden-diff
          # A build failure leaves no diff images; that is still the failure to read.
          if-no-files-found: ignore
          path: targets/esp32s3/ui/host/build/golden/**/*_err.png
