# Firmware smoke test on Espressif QEMU (TSK-S4-08, Q-21), the Q-3 static budget
# (TSK-S4-11) and a user's agent built into a firmware (TSK-I3-01).
#
# `firmware-qemu` builds the ESP32-S3 firmware with sdkconfig.qemu layered on
# sdkconfig.defaults, boots it in Espressif's QEMU (scripts/qemu_boot.sh), and
# requires the boot gate self-test line on the UART: the C walker and the
# single-use token ledger decide the checks of the agent linked into flash —
# components/ne_agent/, the home-voice sample's (targets/esp32s3/main/gate_selftest.c).
# The line before NE_TRACE DONE is the free internal heap; it must clear the Q-3
# floor there, before the network and the audio stack (QEMU has neither, nor PSRAM).
#
# The self-test's gate evaluations also go out as NE1 trace lines, and the
# device then replays the canonical traces, one session each (TSK-S4-09). The
# job `uart-trace` reads the captured UART with the installed CLI: `record`
# writes and validates the sessions, `verify --targets esp32s3 --port` compares
# the device's decisions with the golden references.
#
# `firmware-size` builds the board configuration (sdkconfig.defaults alone: Wi-Fi
# linked) and checks it against Q-3 with scripts/check_firmware_size.py: the image
# fits an A/B slot, and .data + .bss + IRAM code leave >= 120 KB of internal SRAM.
# ESP-SR is not linked yet (TODOS.md #17): the report says so, and the figure is
# the floor without the audio front end.
#
# `agent-firmware` is a user's path: `neuroedge new`, then `neuroedge build --target
# esp32s3` writes an ESP-IDF project from the agent, which builds and boots on QEMU
# with its own self-test passing; an agent the board cannot serve builds nothing.
#
# Covers boot, UART, flash and the gate runtime. Not I2S, Wi-Fi, the LCD or GPIO:
# QEMU does not emulate them, so CONFIG_NEUROEDGE_SKIP_NETWORK leaves Wi-Fi out.
# No NE_SELFTEST PASS within the timeout is a failure, never a pass.
name: firmware-qemu

on:
  # One list for both events: every input of the firmware and of the agent's build —
  # the C sources, the generator and what it reads (gates, boards, schemas, the
  # sample agents, the packaging that ships the sources), and these scripts.
  pull_request:
    paths:
      - "targets/**"
      - "python/neuroedge/engine/**"
      - "python/neuroedge/actions/**"
      - "python/neuroedge/hal/**"
      - "python/neuroedge/templates/**"
      - "python/neuroedge/cli/main.py"
      - "python/neuroedge/paths.py"
      - "python/neuroedge/testing/uart.py"
      - "python/neuroedge/testing/recorder.py"
      - "python/pyproject.toml"
      - "python/hatch_build.py"
      - "gates/**"
      - "boards/**"
      - "schemas/**"
      - "fixtures/traces/*.json"
      - "fixtures/agents/**"
      - "scripts/gen_firmware_gates.py"
      - "scripts/gen_firmware_vectors.py"
      - "scripts/check_firmware_size.py"
      - "scripts/qemu_boot.sh"
      - "scripts/qemu_ota.sh"
      - "scripts/ota_markers.sh"
      - "scripts/build_ota_layer.sh"
      - "scripts/check_stack_usage.py"
      - "scripts/qemu_console.py"
      - "targets/esp32s3/brain/**"
      - "scripts/check_brain_image.py"
      - "scripts/qemu_brain.py"
      - "scripts/qemu_aquarium.py"
      - ".github/workflows/firmware-qemu.yml"
  push:
    branches: [main]
    paths:
      - "targets/**"
      - "python/neuroedge/engine/**"
      - "python/neuroedge/actions/**"
      - "python/neuroedge/hal/**"
      - "python/neuroedge/templates/**"
      - "python/neuroedge/cli/main.py"
      - "python/neuroedge/paths.py"
      - "python/neuroedge/testing/uart.py"
      - "python/neuroedge/testing/recorder.py"
      - "python/pyproject.toml"
      - "python/hatch_build.py"
      - "gates/**"
      - "boards/**"
      - "schemas/**"
      - "fixtures/traces/*.json"
      - "fixtures/agents/**"
      - "scripts/gen_firmware_gates.py"
      - "scripts/gen_firmware_vectors.py"
      - "scripts/check_firmware_size.py"
      - "scripts/qemu_boot.sh"
      - "scripts/qemu_ota.sh"
      - "scripts/ota_markers.sh"
      - "scripts/build_ota_layer.sh"
      - "scripts/check_stack_usage.py"
      - "scripts/qemu_console.py"
      - "targets/esp32s3/brain/**"
      - "scripts/check_brain_image.py"
      - "scripts/qemu_brain.py"
      - "scripts/qemu_aquarium.py"
      - ".github/workflows/firmware-qemu.yml"
  schedule:
    - cron: "30 18 * * *"   # 01:30 UTC+7, after nightly-hardware
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-qemu:
    name: Firmware boots on QEMU and passes the gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.4   # Espressif QEMU needs ESP-IDF >= 5.4 (Q-21)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build esp32s3 with sdkconfig.qemu
        working-directory: targets/esp32s3
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" set-target esp32s3
          idf.py build
          grep -q '^CONFIG_NEUROEDGE_SKIP_NETWORK=y' sdkconfig
          grep -q '^CONFIG_NEUROEDGE_QEMU=y' sdkconfig
          grep -q '^CONFIG_NEUROEDGE_REPLAY_VECTORS=y' sdkconfig

      # Q-79 stack guard, part 1: every function of main and the ne_* components
      # has a static frame of at most 1024 B (-fstack-usage, set in CMakeLists.txt).
      - name: "Stack guard: every frame of ours is static and at most 1024 B"
        run: python3 scripts/check_stack_usage.py targets/esp32s3/build --limit 1024

      - name: Install Espressif QEMU
        run: python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Boot on QEMU and read the UART (120 s)
        run: |
          . "$IDF_PATH/export.sh"
          set +e
          scripts/qemu_boot.sh targets/esp32s3/build 120
          status=$?
          set -e
          line="$(grep -E '^NE_SELFTEST ' targets/esp32s3/build/uart.log 2>/dev/null | head -n1 | tr -d '\r' || true)"
          echo "### Firmware on QEMU" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${line:-no NE_SELFTEST line}\`" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: "Boot heap clears the Q-3 floor (QEMU: before network and audio, no PSRAM)"
        run: |
          set +e
          python3 scripts/check_firmware_size.py --heap-log targets/esp32s3/build/uart.log > heap-report.txt 2>&1
          status=$?
          set -e
          cat heap-report.txt
          {
            echo "### Boot heap on QEMU (TSK-S4-11)"
            echo '```'
            cat heap-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Q-79 stack guard, part 2: the main task's lowest free stack on QEMU.
      - name: "Stack guard: the main task keeps at least 512 B free on QEMU"
        run: python3 scripts/check_stack_usage.py targets/esp32s3/build --uart-log targets/esp32s3/build/uart.log --floor 512

      # Q-79, TSK-I2f-10: three boots that never stay up, the fourth in safe mode;
      # the owner's settings set at the console (a secret at the hidden prompt,
      # never on the UART), kept across a reboot, erased by factory-reset; the
      # console task's free stack after its deepest command.
      - name: Boot guard, safe mode and the serial console on QEMU
        run: |
          . "$IDF_PATH/export.sh"
          set +e
          python3 scripts/qemu_console.py targets/esp32s3/build > console-report.txt 2>&1
          status=$?
          set -e
          cat console-report.txt
          {
            echo "### Boot guard and console on QEMU (Q-79)"
            echo '```'
            cat console-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firmware-qemu-uart
          path: |
            targets/esp32s3/build/uart.log
            targets/esp32s3/build/console-test/*.log
            targets/esp32s3/sdkconfig

  firmware-size:
    name: "Q-3 static budget: flash and internal SRAM (board configuration, TSK-S4-11)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build esp32s3 for the board (sdkconfig.defaults, Wi-Fi linked)
        working-directory: targets/esp32s3
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          if grep -q '^CONFIG_NEUROEDGE_SKIP_NETWORK=y' sdkconfig; then
            echo "::error::the board configuration must link the network stack"
            exit 1
          fi
          idf.py size --format json2 --output-file build/size.json
          idf.py size-components --format json2 --output-file build/size-components.json
          idf.py size

      # Q-79: the flash-encryption layer that keeps the owner's secrets
      # encrypted builds and links. Nothing here burns an eFuse.
      - name: Build the flash-encryption layer (sdkconfig.secure)
        working-directory: targets/esp32s3
        run: |
          . "$IDF_PATH/export.sh"
          defaults="sdkconfig.defaults;sdkconfig.secure"
          idf.py -B build/secure -D SDKCONFIG=build/secure/sdkconfig -D SDKCONFIG_DEFAULTS="$defaults" set-target esp32s3
          idf.py -B build/secure -D SDKCONFIG=build/secure/sdkconfig -D SDKCONFIG_DEFAULTS="$defaults" build
          grep -q '^CONFIG_SECURE_FLASH_ENC_ENABLED=y' build/secure/sdkconfig
          grep -q '^CONFIG_NVS_ENCRYPTION=y' build/secure/sdkconfig

      - name: "Q-3: image <= 3.5 MB, static RAM leaves >= 120 KB of internal SRAM"
        run: |
          set +e
          python3 scripts/check_firmware_size.py targets/esp32s3/build/neuroedge-esp32s3-box3.bin \
            --size-json targets/esp32s3/build/size.json \
            --components-json targets/esp32s3/build/size-components.json > size-report.txt 2>&1
          status=$?
          set -e
          cat size-report.txt
          {
            echo "### Q-3 static budget, board configuration (TSK-S4-11)"
            echo '```'
            cat size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firmware-size
          path: |
            size-report.txt
            targets/esp32s3/build/size.json
            targets/esp32s3/build/size-components.json
            targets/esp32s3/build/*.map

  ota-rollback:
    name: "OTA: signed update, wrong-key refusal and rollback on QEMU (TSK-S6-01/02/04)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Espressif QEMU
        run: python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      # Builds the firmware four times (factory, newer, wrong-key, broken),
      # signs each with throwaway RSA-3072 keys under the git-ignored build
      # tree, serves them from 10.0.2.2 and reads the UART: the factory image
      # keeps working, a signed newer image boots and is marked VALID, a
      # wrong-key image is REJECTED before anything switches, a broken signed
      # image is rolled back by the bootloader, and an image whose self-test
      # fails marks itself INVALID and is rolled back too. It ends by checking
      # the OTA-enabled board image against the Q-3 flash and static-RAM
      # budget. Any missing marker, wrong order or timeout is exit 1.
      - name: OTA end-to-end on QEMU (scripts/qemu_ota.sh)
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          scripts/qemu_ota.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firmware-ota
          path: |
            targets/esp32s3/build/ota-test/logs/

  agent-firmware:
    name: A user's agent, built with neuroedge build --target esp32s3, boots on QEMU (TSK-I3-01)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install neuroedge from this checkout (its own venv, not the ESP-IDF one)
        run: |
          python3 --version
          python3 -m venv /opt/neuroedge
          /opt/neuroedge/bin/python -m pip install --upgrade pip
          /opt/neuroedge/bin/python -m pip install ./python
          # The installed wheel, not the checkout: the firmware sources come from the package.
          echo "NE=/opt/neuroedge/bin/neuroedge" >> "$GITHUB_ENV"

      - name: A new agent — neuroedge build --target esp32s3 writes its firmware
        run: |
          mkdir -p work && cd work
          "$NE" new ci-agent
          cd ci-agent
          "$NE" build --target esp32s3 --board esp32s3-box-3
          project=build/esp32s3
          test -f "$project/CMakeLists.txt"
          test -f "$project/components/ne_agent/ne_agent.c"
          grep -q '^#define NE_AGENT_VERSION "ci-agent@0.1.0"$' "$project/components/ne_agent/include/ne_agent.h"
          # The same agent twice is the same bytes.
          "$NE" build --target esp32s3 --board esp32s3-box-3 --out ../again
          diff -r "$project" ../again/esp32s3

      - name: An agent the board cannot serve builds no firmware (exit 1)
        run: |
          cd work
          "$NE" new bad-agent
          sed -i 's/pins = \["door_lock"\]/pins = ["garage_door"]/' bad-agent/agent.toml
          grep -q 'garage_door' bad-agent/agent.toml
          cd bad-agent
          set +e
          "$NE" build --target esp32s3 --board esp32s3-box-3
          status=$?
          set -e
          if [ "$status" != 1 ]; then echo "::error::expected exit 1, got $status"; exit 1; fi
          if [ -e build ]; then echo "::error::a refused build wrote build/"; exit 1; fi
          echo "  ok  refused with exit 1, nothing written"

      - name: Build the agent's firmware with sdkconfig.qemu
        working-directory: work/ci-agent/build/esp32s3
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" set-target esp32s3
          idf.py build
          grep -q '^CONFIG_NEUROEDGE_QEMU=y' sdkconfig

      - name: Install Espressif QEMU
        run: python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Boot the agent's firmware on QEMU (120 s)
        run: |
          . "$IDF_PATH/export.sh"
          scripts/qemu_boot.sh work/ci-agent/build/esp32s3/build 120
          log=work/ci-agent/build/esp32s3/build/uart.log
          # Column 0 only: the same words inside a trace line are not the device's verdict.
          line="$(grep -oE '^NE_SELFTEST PASS walker=[0-9]+ token=[0-9]+' "$log" | head -n1)"
          walker="$(echo "$line" | sed -E 's/.*walker=([0-9]+).*/\1/')"
          if [ "${walker:-0}" -lt 1 ]; then echo "::error::the self-test checked no gate: $line"; exit 1; fi
          {
            echo "### A user's agent on QEMU"
            echo "\`$line\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The device says it runs the user's agent, and its heap clears the floor
        run: |
          log=work/ci-agent/build/esp32s3/build/uart.log
          "$NE" record --target esp32s3 --port "$log" --out agent-traces/
          /opt/neuroedge/bin/python - <<'PY'
          import json, pathlib
          traces = sorted(pathlib.Path("agent-traces").glob("*.json"))
          selftest = [
              t for t in (json.loads(p.read_text()) for p in traces)
              if not any(e["data"].get("replay_of") for e in t["events"] if e["type"] == "device_info")
          ]
          assert len(selftest) == 1, f"{len(selftest)} self-test sessions"
          meta = selftest[0]["metadata"]
          assert meta["agent_version"] == "ci-agent@0.1.0", meta
          assert meta["device_id"] == "qemu", meta
          results = [e for e in selftest[0]["events"] if e["type"] == "gate_evaluation_result"]
          assert results, "no gate evaluation in the self-test session"
          print(f"  ok  {meta['agent_version']}: {len(results)} gate evaluation(s), device qemu")
          PY
          python3 scripts/check_firmware_size.py --heap-log "$log"

      - name: The agent's firmware also builds with the OTA layer (sdkconfig.ota)
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          scripts/build_ota_layer.sh work/ci-agent/build/esp32s3 0.1.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agent-firmware
          path: |
            work/ci-agent/build/esp32s3/build/uart.log
            work/ci-agent/build/esp32s3/components/ne_agent/
            agent-traces/

  brain-firmware:
    name: Box and brain in one image (Q-83 Profile B) — build, inspect, QEMU, OTA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install neuroedge from this checkout (its own venv, not the ESP-IDF one)
        run: |
          python3 -m venv /opt/neuroedge
          /opt/neuroedge/bin/python -m pip install --upgrade pip
          /opt/neuroedge/bin/python -m pip install ./python
          echo "NE=/opt/neuroedge/bin/neuroedge" >> "$GITHUB_ENV"

      - name: neuroedge build --brain neuroclaw fetches the pinned NeuroClaw-ESP (DP-B-01)
        run: |
          cd fixtures/agents/chat-den-cua
          "$NE" build --target esp32s3 --board esp32s3-box-3 --brain neuroclaw --out "$GITHUB_WORKSPACE/brain"
          project="$GITHUB_WORKSPACE/brain/esp32s3"
          commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' \
            "$GITHUB_WORKSPACE/targets/esp32s3/brain/neuroclaw.lock")"
          grep -qx "commit $commit" "$project/components/neuroclaw/NEUROEDGE_PIN"
          test -f "$project/main/brain.c" && test -f "$project/components/ne_hal/src/ne_hal.c"
          echo "PROJECT=$project" >> "$GITHUB_ENV"

      - name: The board image fits Q-3 and holds no server (TC-B-02-1, TC-B-11-1, TC-B-13-1)
        working-directory: ${{ env.PROJECT }}
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py -B build-board -D SDKCONFIG=build-board/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults" set-target esp32s3
          idf.py -B build-board -D SDKCONFIG=build-board/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults" build
          idf.py -B build-board -D SDKCONFIG=build-board/sdkconfig size --format json2 --output-file build-board/size.json
          idf.py -B build-board -D SDKCONFIG=build-board/sdkconfig size-components --format json2 --output-file build-board/size-components.json
          bin="build-board/$(awk '$1 == "0x10000" { print $2; exit }' build-board/flash_args)"
          python3 "$GITHUB_WORKSPACE/scripts/check_firmware_size.py" "$bin" --partitions partitions.csv \
            --size-json build-board/size.json --components-json build-board/size-components.json
          xtensa-esp32s3-elf-nm build-board/*.elf > build-board/symbols.txt
          python3 "$GITHUB_WORKSPACE/scripts/check_brain_image.py" --symbols build-board/symbols.txt --project .
          python3 "$GITHUB_WORKSPACE/scripts/check_stack_usage.py" build-board --limit 1024
          python3 "$GITHUB_WORKSPACE/scripts/check_stack_usage.py" build-board --component '^ne_brain_bridge$' --limit 512

      - name: Build the same image for QEMU
        working-directory: ${{ env.PROJECT }}
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py -B build -D SDKCONFIG=build/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" set-target esp32s3
          idf.py -B build -D SDKCONFIG=build/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" build
          grep -q '^CONFIG_NEUROEDGE_QEMU=y' build/sdkconfig

      - name: Install Espressif QEMU
        run: python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Labels, one console, offline buttons, settings, the brain starting (TC-COM-06-1, TC-B-10-1, TC-B-11-1, TC-B-14-1, TC-B-16-1, TC-B-17-1)
        run: |
          . "$IDF_PATH/export.sh"
          python3 scripts/qemu_brain.py "$PROJECT/build"

      - name: Free SRAM after the brain started, and every task's stack (TC-B-13-1)
        run: |
          logs="$PROJECT/build/brain-test"
          python3 scripts/check_firmware_size.py --heap-log "$logs/boot-1.log"
          python3 scripts/check_firmware_size.py --heap-log "$logs/boot-2.log" --checkpoint brain_ready
          python3 scripts/check_stack_usage.py "$PROJECT/build" --uart-log "$logs/boot-2.log" \
            --task neuroclaw --task ne_console

      - name: The decisions on the chip replay on the host (TC-B-12-1)
        run: |
          log="$PROJECT/build/brain-test/boot-1.log"
          "$NE" record --target esp32s3 --port "$log" --follow --out brain-traces/
          /opt/neuroedge/bin/python - <<'PY'
          import json, pathlib, subprocess, sys
          agent = "fixtures/agents/chat-den-cua/agent.toml"
          runtime = [
              p for p in sorted(pathlib.Path("brain-traces").glob("*.json"))
              if any(e["type"] == "action_requested" for e in json.loads(p.read_text())["events"])
          ]
          assert len(runtime) == 2, f"{len(runtime)} run-time sessions (light off, door at night)"
          for trace in runtime:
              done = subprocess.run(["/opt/neuroedge/bin/neuroedge", "replay", str(trace), "--agent", agent])
              if done.returncode:
                  sys.exit(f"{trace} does not replay to the same decisions")
          print(f"  ok  {len(runtime)} run-time sessions replay to the same verdicts and pins")
          PY

      - name: OTA of box and brain together; bridge self-check; downgrade refused (TC-B-15-1, TC-B-17-1)
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          NEUROEDGE_OTA_PROJECT="$PROJECT" NEUROEDGE_OTA_BRAIN=1 scripts/qemu_ota.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: brain-firmware
          path: |
            ${{ env.PROJECT }}/build/brain-test/
            ${{ env.PROJECT }}/build/ota-test/logs/
            ${{ env.PROJECT }}/components/neuroclaw/NEUROEDGE_PIN
            brain-traces/

  aquarium-qemu:
    name: The fish tank on one chip (demo D3, D5) — gate and brain on QEMU, decisions replay on the host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install neuroedge from this checkout (its own venv, not the ESP-IDF one)
        run: |
          python3 -m venv /opt/neuroedge
          /opt/neuroedge/bin/python -m pip install --upgrade pip
          /opt/neuroedge/bin/python -m pip install ./python
          echo "NE=/opt/neuroedge/bin/neuroedge" >> "$GITHUB_ENV"

      - name: neuroedge build --brain neuroclaw of fixtures/agents/aquarium
        run: |
          cd fixtures/agents/aquarium
          "$NE" build --target esp32s3 --board esp32s3-box-3 --brain neuroclaw --out "$GITHUB_WORKSPACE/aquarium"
          echo "PROJECT=$GITHUB_WORKSPACE/aquarium/esp32s3" >> "$GITHUB_ENV"

      - name: Build the image for QEMU
        working-directory: ${{ env.PROJECT }}
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py -B build -D SDKCONFIG=build/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" set-target esp32s3
          idf.py -B build -D SDKCONFIG=build/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" build

      - name: Install Espressif QEMU
        run: python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Warm water, no reading, the board's button answering (scripts/qemu_aquarium.py)
        run: |
          . "$IDF_PATH/export.sh"
          python3 scripts/qemu_aquarium.py "$PROJECT/build"

      - name: The tank's decisions on the chip replay on the host
        run: |
          log="$PROJECT/build/aquarium-test/boot-1.log"
          "$NE" record --target esp32s3 --port "$log" --follow --out aquarium-traces/
          /opt/neuroedge/bin/python - <<'PY'
          import json, pathlib, subprocess, sys
          agent = "fixtures/agents/aquarium/agent.toml"
          runtime = [
              p for p in sorted(pathlib.Path("aquarium-traces").glob("*.json"))
              if any(e["type"] == "action_requested" for e in json.loads(p.read_text())["events"])
          ]
          assert len(runtime) == 9, f"{len(runtime)} run-time sessions, 9 buttons pressed"
          for trace in runtime:
              done = subprocess.run(["/opt/neuroedge/bin/neuroedge", "replay", str(trace), "--agent", agent])
              if done.returncode:
                  sys.exit(f"{trace} does not replay to the same decisions")
          print(f"  ok  {len(runtime)} run-time sessions replay to the same verdicts and pins")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: aquarium-qemu
          path: |
            ${{ env.PROJECT }}/build/aquarium-test/
            aquarium-traces/

  uart-trace:
    name: The UART trace validates, and verify --targets esp32s3 passes (TSK-S4-09)
    needs: firmware-qemu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install neuroedge
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-qemu-uart
          path: qemu

      - name: Record the device's sessions and validate them
        run: |
          neuroedge record --target esp32s3 --port qemu/build/uart.log --out traces/
          neuroedge trace validate traces/*.json
          python - <<'PY'
          import json, pathlib
          for path in sorted(pathlib.Path("traces").glob("*.json")):
              trace = json.loads(path.read_text())
              assert trace["metadata"]["device_id"] == "qemu", path
              results = [e for e in trace["events"] if e["type"] == "gate_evaluation_result"]
              assert results, f"{path}: no gate evaluation"
              print(f"  ok  {path.name}: {len(results)} gate evaluation(s), device qemu")
          PY
          {
            echo "### UART trace from QEMU"
            for f in traces/*.json; do echo "- \`$(basename "$f")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The device's replay of the canonical traces matches their golden
        run: |
          neuroedge verify --targets esp32s3 --port qemu/build/uart.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firmware-qemu-traces
          path: traces/
