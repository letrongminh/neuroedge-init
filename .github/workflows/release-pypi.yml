# Release to PyPI (TSK-S3-14, FR-DX-02)
#
# build -> smoke -> publish. The smoke job installs the exact wheel that would be
# published, in a clean runner, and runs the stranger's journey on it
# (scripts/wheel_smoke.sh --wheel). Publishing uses PyPI trusted publishing (OIDC):
# no API token exists anywhere in this repository.
#
# Nothing is published unless BOTH hold:
#   * the run is a pushed tag v*.*.*  (a pre-release tag such as v0.1.0rc1 goes to
#     TestPyPI, a final tag such as v0.1.0 goes to PyPI), and
#   * the repository variable PUBLISH_ENABLED is exactly 'true'.
# Pull requests and manual runs stop after smoke. Go-live steps: docs/release.md.
name: release-pypi

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - python/pyproject.toml
      - python/hatch_build.py
      - python/LICENSE
      - python/LICENSES/**
      - python/neuroedge/paths.py
      - README.md
      - LICENSE
      - LICENSES/**
      - scripts/wheel_smoke.sh
      - .github/workflows/release-pypi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build sdist, then the wheel from it
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build (python -m build makes the sdist, then the wheel from that sdist)
        run: python -m build --outdir dist python

      - name: Metadata and README render on PyPI (twine check --strict)
        run: twine check --strict dist/*

      - name: Which index, if any
        id: channel
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          ls dist
          test -f "dist/neuroedge-${version}.tar.gz"
          test -f "dist/neuroedge-${version}-py3-none-any.whl"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag run: nothing will be published"
            echo "channel=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match python/pyproject.toml version ${version} (expected v${version})"
            exit 1
          fi
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "channel=testpypi" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Installed artifact runs the whole journey (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      NEUROEDGE_ROOT: ""
    steps:
      # The checkout supplies scripts/wheel_smoke.sh and README.md to compare against;
      # the journey itself runs in a temporary directory, never in the checkout.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Stranger's journey on the wheel that would be published
        run: bash scripts/wheel_smoke.sh --wheel dist/neuroedge-*-py3-none-any.whl python

  publish-testpypi:
    name: Publish to TestPyPI (pre-release tags)
    needs: [build, smoke]
    if: >-
      vars.PUBLISH_ENABLED == 'true'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.outputs.channel == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/neuroedge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI (final tags)
    needs: [build, smoke]
    if: >-
      vars.PUBLISH_ENABLED == 'true'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.outputs.channel == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neuroedge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
