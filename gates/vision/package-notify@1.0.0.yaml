# Thị giác 3/3 — kiện hàng trước cửa: chỉ báo "có kiện" khi camera thấy chắc (RFC-0012 §3c).
#
# Một lệnh ít nguy hiểm vẫn qua gate: báo nhầm làm người dùng ra cửa vô ích, nên điểm tin cậy
# của nhãn `package` phải ≥ 0.80 trên từng khung. Cùng cú pháp với hai gate kia: `present` kèm
# `confidence` cùng nhãn và vùng.
schema:  neuroedge.gate/v1
name:    package-notify
version: 1.0.0

evaluate:
  notifications_enabled:
    type: bool
    instructions: "Chủ nhà đang bật thông báo kiện hàng"
  package_present:
    type: bool
    instructions: "Có kiện hàng trong vùng hiên (dữ kiện thị giác, kind = present)"
  package_confidence:
    type: numeric
    unit: ratio
    range: { min: 0, max: 1 }
    max_age_ms: 500
    instructions: "Điểm cao nhất của nhãn kiện hàng trong vùng hiên (dữ kiện thị giác, kind = confidence)"

allow_when:
  notifications_enabled: true
  package_present:       true
  package_confidence:    { gte: 0.80 }

on_block:
  action: deny

budget:
  p95_latency_ms: 100
  fail:           closed
