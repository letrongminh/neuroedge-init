# Thư viện gate khởi đầu 6/7 — camera: bật ghi hình/phát luồng chỉ khi có đồng ý và vùng riêng tư trống.
#
# Dữ kiện thị giác theo RFC-0012 §3c, cùng cú pháp `gates/vision/`: `present` kèm `confidence` cùng nhãn và
# vùng; maker nối nhãn ở `[vision.facts.*]`. Ngưỡng nằm ở ĐÂY, kèm `max_age_ms`, nên camera đứng hình
# không chứng minh được "vùng riêng tư trống". Cần cả ba điều kiện cùng lúc.
schema:  neuroedge.gate/v1
name:    camera
version: 1.0.0

evaluate:
  recording_consent:
    type: bool
    instructions: "Mọi người thường trú trong nhà đã đồng ý ghi hình trong chế độ hiện tại"
  person_in_private_zone:
    type: bool
    instructions: "Có người trong vùng riêng tư (dữ kiện thị giác, kind = present)"
  private_zone_confidence:
    type: numeric
    unit: ratio
    range: { min: 0, max: 1 }
    max_age_ms: 300
    instructions: "Điểm cao nhất của nhãn người trong vùng riêng tư (dữ kiện thị giác, kind = confidence)"

allow_when:
  recording_consent:       true
  person_in_private_zone:  false
  private_zone_confidence: { lte: 0.10 }

on_block:
  action: deny

budget:
  p95_latency_ms: 120
  fail:           closed
