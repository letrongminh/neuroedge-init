# Thư viện gate khởi đầu 7/7 — động cơ (`motion.motor`, RFC-0011): chỉ chạy khi nút dừng khẩn đã nhả và dòng điện trong giới hạn.
#
# Hai nguồn dữ kiện có thật trên bo mạch hôm nay: `estop_released` từ một dòng `digital.in`, và
# `motor_current_sense` là điện áp chân CS (current-sense) của mạch điều khiển động cơ, đọc qua kênh
# `analog.in` đơn vị V (`[sim.analog_facts]`, RFC-0010). Thang V→A tuỳ mạch điều khiển; ngưỡng 1.0 V ở đây
# bảo thủ (khoảng một nửa dải 2.5 V của ADC) và maker siết thêm theo bảng dữ liệu mạch của mình. Không có
# cảm biến nhiệt trong gate: chưa có nguồn số đo nào cho nó.
# Mỗi lease mang đúng một lệnh và gia hạn bằng một lời gọi mới qua gate, nên gate được lượng giá lại ở từng
# lần gia hạn: dòng quá ngưỡng là ngừng gia hạn, lease hết hạn ⇒ `safe_state`. Lệnh `stop` về phía an toàn
# không bao giờ qua gate này (RFC-0011 §9.1). Ngân sách 100 ms ≤ lease_ms / 2 với lease mặc định 200 ms.
schema:  neuroedge.gate/v1
name:    motor
version: 1.0.0

evaluate:
  estop_released:
    type: bool
    instructions: "Nút dừng khẩn đã nhả và mạch an toàn đóng (digital.in)"
  motor_current_sense:
    type: numeric
    unit: V
    range: { min: 0, max: 2.5 }
    max_age_ms: 200
    instructions: "Điện áp chân current-sense của mạch điều khiển động cơ, volt (analog.in)"

allow_when:
  estop_released:      true
  motor_current_sense: { lte: 1.0 }

on_block:
  action: deny

budget:
  p95_latency_ms: 100
  fail:           closed
