invalid:
  board/invalid/schema_v2.json:
    against: "board.v1.json"
    error: { keyword: const, path: "schema", message_contains: "'neuroedge.board/v1' was expected" }
  error/invalid/code_wrong_shape.json:
    against: "error.v1.json"
    error: { keyword: pattern, path: "code", message_contains: "'E1001' does not match '^NE[0-9]{4}$'" }
  error/invalid/how_missing.json:
    against: "error.v1.json"
    error: { keyword: required, path: "", message_contains: "'how'" }
  error/invalid/ne1002_without_reason.json:
    against: "error.v1.json"
    error: { keyword: required, path: "", message_contains: "'reason'" }
  error/invalid/ne2003_principle_as_a_number.json:
    against: "error.v1.json"
    error: { keyword: type, path: "principle", message_contains: "2 is not of type 'string'" }
  error/invalid/ne2003_without_principle.json:
    against: "error.v1.json"
    error: { keyword: required, path: "", message_contains: "'principle'" }
  error/invalid/why_empty.json:
    against: "error.v1.json"
    error: { keyword: minLength, path: "why", message_contains: "'' should be non-empty" }
  tool-call/invalid/call_source_outside_the_five.json:
    against: "tool-call.v1.json#/$defs/call"
    error: { keyword: enum, path: "source", message_contains: "'mcp_network' is not one of ['local_grammar', 'system_one', " }
  tool-call/invalid/call_with_an_unknown_key.json:
    against: "tool-call.v1.json#/$defs/call"
    error: { keyword: additionalProperties, path: "", message_contains: "Additional properties are not allowed ('token' was unexpecte" }
  tool-call/invalid/call_without_a_name.json:
    against: "tool-call.v1.json#/$defs/call"
    error: { keyword: required, path: "", message_contains: "'name'" }
  tool-call/invalid/request_arguments_is_an_array.json:
    against: "tool-call.v1.json#/$defs/request"
    error: { keyword: type, path: "arguments", message_contains: "[] is not of type 'object'" }
  tool-call/invalid/request_declares_source.json:
    against: "tool-call.v1.json#/$defs/request"
    error: { keyword: additionalProperties, path: "", message_contains: "Additional properties are not allowed ('source' was unexpect" }
  tool-call/invalid/request_name_empty.json:
    against: "tool-call.v1.json#/$defs/request"
    error: { keyword: minLength, path: "name", message_contains: "'' should be non-empty" }
  tool-call/invalid/tool_description_input_schema_is_open.json:
    against: "tool-call.v1.json#/$defs/tool"
    error: { keyword: required, path: "inputSchema", message_contains: "'additionalProperties'" }
  tool-call/invalid/tool_description_parameter_type_array.json:
    against: "tool-call.v1.json#/$defs/tool"
    error: { keyword: enum, path: "inputSchema/properties/x/type", message_contains: "'array' is not one of ['string', 'integer', 'number', 'boole" }
  tool-result/invalid/block_without_gate.json:
    against: "tool-result.v1.json"
    error: { keyword: required, path: "", message_contains: "'gate'" }
  tool-result/invalid/block_without_on_block.json:
    against: "tool-result.v1.json"
    error: { keyword: required, path: "", message_contains: "'on_block'" }
  tool-result/invalid/confirmation_without_who.json:
    against: "tool-result.v1.json"
    error: { keyword: required, path: "confirmation", message_contains: "'who'" }
  tool-result/invalid/fallback_status_rejected.json:
    against: "tool-result.v1.json"
    error: { keyword: enum, path: "fallback/status", message_contains: "'REJECTED' is not one of ['ALLOW', 'BLOCK']" }
  tool-result/invalid/known_key_of_the_wrong_type.json:
    against: "tool-result.v1.json"
    error: { keyword: type, path: "gate", message_contains: "1 is not of type 'string'" }
  tool-result/invalid/nested_fallback_block_without_gate.json:
    against: "tool-result.v1.json"
    error: { keyword: required, path: "fallback/fallback", message_contains: "'gate'" }
  tool-result/invalid/on_block_outside_the_four.json:
    against: "tool-result.v1.json"
    error: { keyword: enum, path: "on_block", message_contains: "'ignore' is not one of ['deny', 'escalate', 'ask', 'degrade'" }
  tool-result/invalid/reason_not_snake_case.json:
    against: "tool-result.v1.json"
    error: { keyword: pattern, path: "reason", message_contains: "'Condition Not Met' does not match '^[a-z][a-z0-9_]*$'" }
  tool-result/invalid/rejected_with_empty_problems.json:
    against: "tool-result.v1.json"
    error: { keyword: minItems, path: "problems", message_contains: "[] should be non-empty" }
  tool-result/invalid/rejected_without_problems.json:
    against: "tool-result.v1.json"
    error: { keyword: required, path: "", message_contains: "'problems'" }
  tool-result/invalid/status_outside_the_three.json:
    against: "tool-result.v1.json"
    error: { keyword: enum, path: "status", message_contains: "'PENDING' is not one of ['ALLOW', 'BLOCK', 'REJECTED']" }
