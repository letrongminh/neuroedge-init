  tool-result/valid/block_reason_confidence_unavailable.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_reason_criterion_unavailable.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_reason_gate_not_found.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_reason_gate_unreachable.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_reason_token_expired.json: { against: "tool-result.v1.json" }
