# Đáp án của fixtures/contracts/ (RFC-0015 §7): mỗi tệp một mục, mỗi mục một tệp.
#
# `against` là lược đồ (và đoạn `#/$defs/…`) mà tệp được thẩm định theo. Tệp `valid/` phải hợp lệ;
# tệp `invalid/` phải bị đúng lỗi ghi ở `error`: `keyword` và `path` (đường dẫn trong tài liệu, dạng
# `a/b`, rỗng là gốc) của một lỗi cấp cao nhất, và `message_contains` — chuỗi con của thông điệp.
# python/tests/test_contracts.py cưỡng chế cả hai chiều và việc phủ giá trị.

valid:
  board/valid/sim-default.json: { against: "board.v1.json" }
  board/valid/without_schema_key.json: { against: "board.v1.json" }
  error/valid/NE0000_NeuroEdgeError.json: { against: "error.v1.json" }
  error/valid/NE1001_ActionContractViolation.json: { against: "error.v1.json" }
  error/valid/NE1002_TokenReplayError.json: { against: "error.v1.json" }
  error/valid/NE1003_EnvelopeRefusedError.json: { against: "error.v1.json" }
  error/valid/NE1004_ToolCallError.json: { against: "error.v1.json" }
  error/valid/NE2000_GateError.json: { against: "error.v1.json" }
  error/valid/NE2001_GateNotFoundError.json: { against: "error.v1.json" }
  error/valid/NE2002_GateSchemaError.json: { against: "error.v1.json" }
  error/valid/NE2003_GateInheritanceError.json: { against: "error.v1.json" }
  error/valid/NE3001_BoardCapabilityError.json: { against: "error.v1.json" }
  error/valid/NE3002_AgentManifestError.json: { against: "error.v1.json" }
  error/valid/NE3003_BuildFailed.json: { against: "error.v1.json" }
  error/valid/NE4001_TraceValidationError.json: { against: "error.v1.json" }
  error/valid/NE4002_SafetyRegressionError.json: { against: "error.v1.json" }
  error/valid/NE4003_ReplayError.json: { against: "error.v1.json" }
  error/valid/NE4004_VerificationError.json: { against: "error.v1.json" }
  error/valid/NE5001_PerceptionUnavailableError.json: { against: "error.v1.json" }
  tool-call/valid/call_source_local_grammar.json: { against: "tool-call.v1.json#/$defs/call" }
  tool-call/valid/call_source_mcp.json: { against: "tool-call.v1.json#/$defs/call" }
  tool-call/valid/call_source_system_one.json: { against: "tool-call.v1.json#/$defs/call" }
  tool-call/valid/call_source_system_two.json: { against: "tool-call.v1.json#/$defs/call" }
  tool-call/valid/call_source_test.json: { against: "tool-call.v1.json#/$defs/call" }
  tool-call/valid/request_empty_id.json: { against: "tool-call.v1.json#/$defs/request" }
  tool-call/valid/request_minimal.json: { against: "tool-call.v1.json#/$defs/request" }
  tool-call/valid/request_with_id_and_arguments.json: { against: "tool-call.v1.json#/$defs/request" }
  tool-call/valid/tool_description.json: { against: "tool-call.v1.json#/$defs/tool" }
  tool-result/valid/allow.json: { against: "tool-result.v1.json" }
  tool-result/valid/allow_with_a_key_not_known_yet.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_degrade_fallback_blocked.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_degrade_fallback_nested_two_levels.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_on_block_ask.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_on_block_degrade_fallback_allowed.json: { against: "tool-result.v1.json" }
  tool-result/valid/block_on_block_escalate.json: { against: "tool-result.v1.json" }
