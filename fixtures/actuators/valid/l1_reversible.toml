[requires]
"digital.out" = { pins = ["porch_lamp"] }

[plugins]
enable = ["neuroedge-ref-actuators"]

[actuators.porch_lamp]
plugin = "ref_l1"
safe_off = "L1"
reversible = true

[actuators.porch_lamp.envelope]
window_s = 3600
max_on_ms_per_window = 1800000
min_interval_ms = 2000
max_continuous_ms = 600000

[actuators.porch_lamp.config]
port = 8123
token_env = "NE_LAMP_TOKEN"
