# RFC-0010 §3c: duty, tần số và thời gian đều trong giới hạn của gate. `fan` là kênh PWM của
# `sim-rpi5` (không có ở `sim-default`). duty 0.5 là đúng 512/1024 bước của 10 bit.
agent: fan-pwm
board: sim-rpi5
call:  { name: fan_run, arguments: { duty: 0.5, frequency_hz: 1000, duration_ms: 5000 }, source: mcp }
