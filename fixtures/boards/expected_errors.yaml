motion_servo_range_inverted.toml:
  where_contains: "capabilities.motion.servo.gripper"
  why_contains: "target_min (90) is not below target_max (0)"

motion_signal_pins.toml:
  where_contains: "capabilities.motion"
  why_contains: "Additional properties are not allowed ('signal_pins' was unexpected)"

motion_speed_max_above_one.toml:
  where_contains: "capabilities.motion.motor.0.speed_max"
  why_contains: "1.5 is greater than the maximum of 1"

motion_speed_max_zero.toml:
  where_contains: "capabilities.motion.motor.0.speed_max"
  why_contains: "0 is less than or equal to the minimum of 0"

