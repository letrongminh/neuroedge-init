  why_contains: "501 is greater than the maximum of 500"

motion_lease_zero.toml:
  where_contains: "capabilities.motion.motor.0.lease_ms"
  why_contains: "0 is less than or equal to the minimum of 0"

motion_motor_enable_pin_missing.toml:
  where_contains: "capabilities.motion.motor.0"
  why_contains: "'enable_pin' is a required property"

motion_motor_key_on_servo.toml:
  where_contains: "capabilities.motion.servo.0"
  why_contains: "Additional properties are not allowed ('speed_max' was unexpected)"

motion_safe_state_home.toml:
