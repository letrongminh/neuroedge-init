  why_contains: "safe_state = \"hold\" needs holds_position = true and max_hold_ms"

motion_hold_without_max_hold_ms.toml:
  where_contains: "capabilities.motion.servo.gripper"
  why_contains: "safe_state = \"hold\" needs holds_position = true and max_hold_ms"

motion_lease_above_500.toml:
