# Expected diagnostics for fixtures/gates/invalid/.
#
# Sprint 1 exit criterion 1 requires the frozen schemas to ship with valid
# examples *and* invalid examples carrying their expected error. This file is
# that contract, and tests/test_gate_fixtures.py enforces it: every entry must
# fail exactly this way, and every file in invalid/ must have an entry.
#
# `why_contains` and `where_contains` are substring assertions, so wording can
# be improved without editing this file — but the error class, the stable code
# and the cited Appendix B.5 principle may not drift silently.

loosens_level.yaml:
  error: GateInheritanceError
  code: NE2003
  principle: 2
  where_contains: "allow_when.risk_level"
  why_contains: "loosens the inherited condition"

