# Expected failures for fixtures/gates/home/invalid/ — TSK-I2b-03.
#
# Each child tries to loosen a library gate of gates/home/ (A5 style): a threshold, a freshness lock
# (`max_age_ms`, `range`, `unit`), the sign of a clause, an argument limit, the `budget` or `on_block`.
# They resolve against the monorepo `gates/`, not the fixture registry: python/tests/test_home_gates.py
# requires every file here to fail exactly this way, every file to have an entry, every entry a file,
# and every gate of gates/home/ to have at least one counter-example.

camera_raises_confidence_ceiling.yaml:
  error: GateInheritanceError
  code: NE2003
  principle: 2
  where_contains: "allow_when.private_zone_confidence"
  why_contains: "loosens the inherited condition"

