# RFC-0009 test base for numeric criteria inheritance.
schema:  neuroedge.gate/v1
name:    numeric-base
version: 1.0.0

evaluate:
  line_pressure:
    type: numeric
    unit: bar
    range: { min: 0, max: 16 }
    max_age_ms: 500
    instructions: "Line pressure in bar"
  temperature:
    type: numeric
    unit: degC
    range: { min: -40, max: 125 }
    max_age_ms: 1000
    instructions: "Ambient temperature in Celsius"

allow_when:
  line_pressure: { gte: 2, lt: 8 }
  temperature:   { gt: 2, lt: 30 }

on_block:
  action: deny

budget:
  p95_latency_ms: 100
