# Expected failures for fixtures/gates/vision/invalid/ — TSK-V1b-06.
#
# Each child tries to loosen a vision gate of gates/vision/ (A5 style): a ceiling or floor on the
# confidence or the count, the sign of the presence clause, or the freshness lock (`max_age_ms`,
# `range`) that makes a stale camera block. They resolve against the monorepo `gates/`, not the
# fixture registry: python/tests/test_vision_gates.py requires every file here to fail exactly this
# way, every file to have an entry, and every entry a file.

stranger_loosens_ceiling.yaml:
  error: GateInheritanceError
  code: NE2003
  principle: 2
  where_contains: "allow_when.stranger_confidence"
  why_contains: "loosens the inherited condition"

