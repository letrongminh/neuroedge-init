# Schema error — numeric range with min > max.
schema:  neuroedge.gate/v1
name:    numeric-range-reversed
version: 1.0.0

evaluate:
  line_pressure:
    type: numeric
    unit: bar
    range: { min: 20, max: 10 }
    max_age_ms: 500
    instructions: "Line pressure"

allow_when:
  line_pressure: { lt: 8 }

on_block:
  action: deny

budget:
  p95_latency_ms: 100
