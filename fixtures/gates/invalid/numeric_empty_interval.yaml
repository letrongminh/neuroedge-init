# Schema error — numeric clause with empty interval (gt 5, lt 5).
schema:  neuroedge.gate/v1
name:    numeric-empty-interval
version: 1.0.0

evaluate:
  line_pressure:
    type: numeric
    unit: bar
    range: { min: 0, max: 16 }
    max_age_ms: 500
    instructions: "Line pressure"

allow_when:
  line_pressure: { gt: 5, lt: 5 }

on_block:
  action: deny

budget:
  p95_latency_ms: 100
