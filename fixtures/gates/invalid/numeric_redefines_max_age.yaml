# Principle 1 — child redefines max_age_ms of an inherited numeric criterion.
schema:  neuroedge.gate/v1
name:    numeric-redefines-max-age
version: 1.0.0
extends: neuroedge://gates/numeric-base@1.0.0

evaluate:
  line_pressure:
    type: numeric
    unit: bar
    range: { min: 0, max: 16 }
    max_age_ms: 200
    instructions: "Line pressure in bar"
