# Schema error — numeric criterion with max_age_ms: 0 violates exclusiveMinimum: 0.
schema:  neuroedge.gate/v1
name:    numeric-max-age-ms-zero
version: 1.0.0

evaluate:
  line_pressure:
    type: numeric
    unit: bar
    range: { min: 0, max: 16 }
    max_age_ms: 0
    instructions: "Line pressure"

allow_when:
  line_pressure: { lt: 8 }

on_block:
  action: deny

budget:
  p95_latency_ms: 100
