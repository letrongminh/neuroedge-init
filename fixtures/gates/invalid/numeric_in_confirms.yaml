# Schema error — numeric criterion cannot be confirmed by a person (RFC-0009 §3a).
schema:  neuroedge.gate/v1
name:    numeric-in-confirms
version: 1.0.0

evaluate:
  line_pressure:
    type: numeric
    unit: bar
    range: { min: 0, max: 16 }
    max_age_ms: 500
    instructions: "Line pressure in bar"

allow_when:
  line_pressure: { lt: 8 }

on_block:
  action: ask
  message: "Confirm physical measurement override?"
  confirms: [line_pressure]

budget:
  p95_latency_ms: 100
