# RFC-0004 R3 (principle 2) — the `lax-night` on_block: the base denies, the
# child would run an unauthenticated unlock instead.
schema:  neuroedge.gate/v1
name:    introduces-degrade
version: 1.0.0
extends: neuroedge://gates/strict-base@1.0.0
on_block:
  action:          degrade
  fallback_action: unlock_door_no_auth
