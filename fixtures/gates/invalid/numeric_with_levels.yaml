# Schema error — 'levels' is forbidden on a numeric criterion.
schema:  neuroedge.gate/v1
name:    numeric-with-levels
version: 1.0.0

evaluate:
  line_pressure:
    type: numeric
    unit: bar
    range: { min: 0, max: 16 }
    max_age_ms: 500
    instructions: "Line pressure"
    levels: [low, high]

allow_when:
  line_pressure: { lt: 8 }

on_block:
  action: deny

budget:
  p95_latency_ms: 100
