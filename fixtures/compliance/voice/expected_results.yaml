    - {offset_ms: 2000, type: voice_state_changed, data: {from: IDLE, to: LISTENING, trigger: wake_word, turn: 2}}
    - {offset_ms: 3500, type: voice_state_changed, data: {from: LISTENING, to: THINKING, trigger: turn_end, turn: 2}}
    - {offset_ms: 3600, type: actuator_aborted, data: {pin: door_lock, reason: ACTUATOR_ABORTED_BY_BARGE_IN}}
    - {offset_ms: 3600, type: voice_state_changed, data: {from: THINKING, to: BARGE_IN, trigger: barge_in, turn: 2}}
    - {offset_ms: 3600, type: voice_state_changed, data: {from: BARGE_IN, to: LISTENING, trigger: barge_in, turn: 3}}
    - {offset_ms: 4700, type: voice_state_changed, data: {from: LISTENING, to: THINKING, trigger: turn_end, turn: 3}}
