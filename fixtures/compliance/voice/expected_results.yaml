# Đáp án của bộ vector tuân thủ máy trạng thái hội thoại (TSK-S3-10, docs/spec/voice_fsm.md §9).
#
# Mỗi tệp *.json trong thư mục này có đúng một mục ở đây, và mỗi mục có đúng một tệp:
# python/tests/test_voice_corpus.py fail khi lệch. Tệp ca chỉ nêu đầu vào (agent, tham số §6,
# thế giới, sự kiện đầu vào ở offset_ms ảo); tệp này nêu đáp án.
#
# `events` là MỌI sự kiện quan sát được, đúng thứ tự, mỗi sự kiện ở đúng offset_ms. Loại nào
# quan sát được và trường nào được so: §9.1 (và OBSERVED trong neuroedge/testing/voice_corpus.py).
# Trường strict vắng mặt nghĩa là null. `text` của tts_stream_start chỉ được so khi ghi ở đây:
# câu do vector kịch bản hoá (system_two_reply) hoặc do gate khai thì ghi; câu thiết bị tự nói
# (câu offline, lời nhắc xác nhận) thì không.
#
# Hiện thực C/C++ (TSK-S5-03) phải cho đúng các sự kiện này từ đúng các tệp đó.

v1_barge_in_cancels_scheduled_unlock.json:
  proves: >-
    V1: lệnh hẹn giờ đã được gate ALLOW và cấp token nhưng chưa tới chân bị hủy ngay khi cắt lời,
    trước khi TTS dừng; chân door_lock không bao giờ nhận xung (hạn giao 4600 trôi qua im lặng);
    dùng lại token của lệnh bị hủy bị từ chối token_replayed.
  events:
    - {offset_ms: 0, type: voice_state_changed, data: {from: IDLE, to: LISTENING, trigger: wake_word, turn: 1}}
    - {offset_ms: 2200, type: voice_state_changed, data: {from: LISTENING, to: THINKING, trigger: turn_end, turn: 1}}
    - {offset_ms: 2600, type: action_requested, data: {action: open_door_later}}
    - {offset_ms: 2600, type: gate_evaluation_result, data: {verdict: ALLOW}}
    - {offset_ms: 2600, type: tts_stream_start, data: {text: "Cửa sẽ mở sau hai giây."}}
    - {offset_ms: 2600, type: voice_state_changed, data: {from: THINKING, to: SPEAKING, trigger: reply_start, turn: 1}}
    - {offset_ms: 3100, type: actuator_aborted, data: {pin: door_lock, reason: ACTUATOR_ABORTED_BY_BARGE_IN}}
    - {offset_ms: 3100, type: tts_stream_end, data: {reason: barge_in, duration_ms: 500}}
    - {offset_ms: 3100, type: voice_state_changed, data: {from: SPEAKING, to: BARGE_IN, trigger: barge_in, turn: 1}}
    - {offset_ms: 3100, type: voice_state_changed, data: {from: BARGE_IN, to: LISTENING, trigger: barge_in, turn: 2}}
    - {offset_ms: 5000, type: actuator_command_rejected, data: {pin: door_lock, reason: token_replayed}}
    - {offset_ms: 5900, type: voice_state_changed, data: {from: LISTENING, to: THINKING, trigger: turn_end, turn: 2}}
    - {offset_ms: 6200, type: tts_stream_start, data: {text: "Vâng."}}
    - {offset_ms: 6200, type: voice_state_changed, data: {from: THINKING, to: SPEAKING, trigger: reply_start, turn: 2}}
    - {offset_ms: 7500, type: voice_state_changed, data: {from: SPEAKING, to: IDLE, trigger: reply_end, turn: 2}}

