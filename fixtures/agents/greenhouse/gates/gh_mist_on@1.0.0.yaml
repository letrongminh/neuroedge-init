# No misting when the air is already humid (>= 90 %); no reading fails closed.
schema:  neuroedge.gate/v1
name:    gh_mist_on
version: 1.0.0

evaluate:
  call_source:
    type: choice
    options: [local_grammar, system_one, system_two, mcp, test]
    instructions: "Nguồn của tool call, do dispatcher đặt (Q-24)"
  air_humid:
    type: bool
    instructions: "Không khí trong nhà kính rất ẩm (từ 90 %), do cảm biến độ ẩm báo"

allow_when:
  call_source: { in: [local_grammar, system_one, system_two, mcp] }
  air_humid:      false

on_block:
  action:  deny
  message: "Không khí đã rất ẩm (từ 90 %) — không phun sương."

budget:
  p95_latency_ms: 150
  fail:           closed
