# No heating when the air is already hot (>= 30 C), whoever asks; no reading leaves air_hot undecided and the gate fails closed.
schema:  neuroedge.gate/v1
name:    gh_heater_on
version: 1.0.0

evaluate:
  call_source:
    type: choice
    options: [local_grammar, system_one, system_two, mcp, test]
    instructions: "Nguồn của tool call, do dispatcher đặt (Q-24)"
  air_hot:
    type: bool
    instructions: "Không khí trong nhà kính đang nóng (từ 30 °C), do cảm biến nhiệt độ báo"

allow_when:
  call_source: { in: [local_grammar, system_one, system_two, mcp] }
  air_hot:      false

on_block:
  action:  deny
  message: "Không khí đang nóng (từ 30 °C) — không bật sưởi."

budget:
  p95_latency_ms: 150
  fail:           closed
