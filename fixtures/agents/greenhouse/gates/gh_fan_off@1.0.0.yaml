# The fan stays on while it is very hot (>= 35 C); no reading fails closed.
schema:  neuroedge.gate/v1
name:    gh_fan_off
version: 1.0.0

evaluate:
  call_source:
    type: choice
    options: [local_grammar, system_one, system_two, mcp, test]
    instructions: "Nguồn của tool call, do dispatcher đặt (Q-24)"
  air_very_hot:
    type: bool
    instructions: "Nhà kính đang rất nóng (từ 35 °C), do cảm biến nhiệt độ báo"

allow_when:
  call_source: { in: [local_grammar, system_one, system_two, mcp] }
  air_very_hot:      false

on_block:
  action:  deny
  message: "Đang rất nóng (từ 35 °C) — không tắt quạt hút."

budget:
  p95_latency_ms: 150
  fail:           closed
