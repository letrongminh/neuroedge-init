# Mở rèm: kế thừa gate `motor` của thư viện khởi đầu (nút dừng khẩn đã nhả, điện áp current-sense trong giới
# hạn, ngân sách 100 ms ≤ lease_ms / 2) và chỉ siết thêm: trần current-sense của servo hạ từ 1,0 V xuống 0,8 V.
