# Ngữ pháp lệnh cố định của agent blinds (Q-14, Q-15).
[grammar]
version   = 1
threshold = 0.80

[[command]]
intent   = "blinds_open"
patterns = ["mở rèm", "kéo rèm ra", "open the blinds"]
tool     = "blinds_open"

[[command]]
intent   = "blinds_close"
patterns = ["đóng rèm", "kéo rèm lại", "close the blinds"]
tool     = "blinds_close"
