# Turning a light off in the dark while someone is on the stairs cannot be
# taken back the way a wrong answer can. The motion sensor decides: someone
# moving ⇒ the light stays on and the assistant asks to confirm.
schema:  neuroedge.gate/v1
name:    light_off
version: 1.0.0

evaluate:
  command_recognized:
    type: bool
    instructions: "Câu lệnh khớp ngữ pháp lệnh cố định trong commands.toml"
  room_empty:
    type: bool
    instructions: "Cảm biến chuyển động không thấy ai trong phòng"

allow_when:
  command_recognized: true
  room_empty:         true

on_block:
  action:  ask
  message: "Vẫn còn người trong phòng — bạn chắc muốn tắt đèn?"

budget:
  p95_latency_ms: 150
  fail:           closed
