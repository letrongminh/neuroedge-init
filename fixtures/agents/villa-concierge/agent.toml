# Sample agent for `neuroedge build` (TSK-S2-02) and the A1 wedge.
#
# It needs hardware echo cancellation, so it builds for `sim-default` and
# `esp32s3-box-3` and is refused on `linux-rpi5` (aec = false) — the board drift
# the build check exists to catch before anything reaches a device.
[agent]
name    = "villa-concierge"
version = "0.1.0"

[requires]
"audio.in"    = { aec = true, sample_rate_hz = 16000 }
"audio.out"   = {}
"display"     = { min_width = 240 }
"digital.out" = { pins = ["door_lock"] }

[gates]
unlock_door = "neuroedge://gates/unlock_door@1.2.0"

[targets]
supported = ["sim", "linux", "esp32s3"]

# Session facts for `neuroedge run --target sim`. On a device they come from the
# property system (booking, identity check); the simulator reads them from here
# and the REPL changes them with `:set` / `:unset`. They are never inferred from
# what the guest typed.
[sim.facts]
guest_authenticated = true
risk_level          = "low"

# A fact derived from a slot the grammar extracted: "mở cửa phòng 101" matches
# the booking, "mở cửa phòng 202" does not, and a bare "mở cửa" leaves
# room_matches undecided, which blocks.
[sim.slot_facts]
room_matches = { slot = "room", equals = "101" }
