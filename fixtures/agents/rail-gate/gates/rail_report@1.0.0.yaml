# Báo điện áp nguồn đọc từ ina219 không đụng chân nào, nhưng vẫn đi qua một gate (A3).
# `call_source` do dispatcher đặt (Q-24).
schema:  neuroedge.gate/v1
name:    rail_report
version: 1.0.0

evaluate:
  call_source:
    type: choice
    options: [local_grammar, system_one, system_two, mcp, test]
    instructions: "Nguồn của tool call, do dispatcher đặt (Q-24)"

allow_when:
  call_source: { in: [local_grammar, system_one, system_two, mcp] }

on_block:
  action: deny

budget:
  p95_latency_ms: 150
  fail:           closed
