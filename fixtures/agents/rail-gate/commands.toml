# Ngữ pháp lệnh cố định của agent rail-gate (Q-14, Q-15).
[grammar]
version   = 1
threshold = 0.80

[[command]]
intent   = "rail_open_gate"
patterns = ["mở cổng", "open the gate"]
tool     = "rail_open_gate"

[[command]]
intent   = "rail_report"
patterns = ["báo điện áp nguồn", "report the supply voltage"]
tool     = "rail_report"
