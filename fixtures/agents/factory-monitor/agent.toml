# Sample agent: environment monitoring on a factory floor (TSK-S3-08).
#
# A ventilation fan and an alarm beacon, both physical, both behind gates that
# read one `level` fact — the heat band of the machine room:
#
#   low · normal · high · critical
#
#   * vent_on / alarm_on — always allowed: more air and more warning are safe;
#   * vent_off           — allowed up to `normal`; at `high` the device asks an
#                          operator to confirm (RFC-0006); at `critical` it
#                          refuses without asking;
#   * alarm_off          — refused above `normal`: nobody silences the alarm
#                          while the room is still hot.
#
# The gates compare bands, not degrees: a numeric criterion would need
# `evaluate.type: numeric`, which gate.v1 does not have (TODOS.md #30). The
# sensor reports degrees Celsius — `sim` from [sim.sensors], `linux` from the
# kernel (an lm75 through hwmon) — and [sim.sensor_facts] below turns the
# reading into the band, the same way on both targets.
[agent]
name    = "factory-monitor"
version = "0.1.0"

# `sim-default` and `linux-rpi5` name their relays after other samples: here
# `gate_relay` drives the fan contactor and `porch_light` the alarm beacon.
[requires]
"digital.out" = { pins = ["gate_relay", "porch_light"] }
"sensor.read" = { sensors = ["temperature"] }

[gates]
vent_on   = "gates/vent_on@1.0.0.yaml"
vent_off  = "gates/vent_off@1.0.0.yaml"
alarm_on  = "gates/alarm_on@1.0.0.yaml"
alarm_off = "gates/alarm_off@1.0.0.yaml"

[targets]
supported = ["sim", "linux"]

# `sim` starts hot (45 °C, band `high`), so the gates have something to refuse.
# Change the reading with `:sensor temperature 30` (or 50, 60) in the REPL or the
# UI. On linux the unit is checked: a kernel reading in another unit is refused.
[sim.sensors]
temperature = { value = 45, unit = "C" }

# Each band starts at its bound, inclusive, and ends where the next one starts:
# 25 °C is `normal`, 24.5 °C `low`, 55 °C `critical`; the last band is the gates'
# highest level. heat_critical must sit on a band bound (checked at load) — here
# the `critical` one — and both facts come from one reading. A reading below
# -40 °C (an open or shorted probe), or none at all, leaves both undecided: every
# gate that reads them refuses without asking, while vent_on / alarm_on still work.
[sim.sensor_facts]
heat_level    = { sensor = "temperature", bands = { low = -40, normal = 25, high = 40, critical = 55 } }
heat_critical = { sensor = "temperature", gte = 55 }
