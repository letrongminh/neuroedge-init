# Nobody silences the alarm while the machine room is still hot: above `normal`
# the request is refused outright — no question, no confirmation, for every
# caller. The alarm goes quiet once the sensor reports the room has cooled.
schema:  neuroedge.gate/v1
name:    alarm_off
version: 1.0.0

evaluate:
  call_source:
    type: choice
    options: [local_grammar, system_one, system_two, mcp, test]
    instructions: "Nguồn của tool call, do dispatcher đặt (Q-24)"
  heat_level:
    type: level
    levels: [low, normal, high, critical]
    instructions: "Dải nhiệt của phòng máy, do cảm biến nhiệt báo"

allow_when:
  call_source: { in: [local_grammar, system_one, system_two, mcp] }
  heat_level:  { lte: normal }

on_block:
  action: deny

budget:
  p95_latency_ms: 150
  fail:           closed
