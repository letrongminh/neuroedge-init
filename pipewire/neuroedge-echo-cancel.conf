# NeuroEdge — software echo cancellation for target `linux` (TSK-S5-08, Q-22).
#
# Ship this file as the drop-in
#   ~/.config/pipewire/pipewire.conf.d/neuroedge-echo-cancel.conf      (a user)
#   /etc/pipewire/pipewire.conf.d/neuroedge-echo-cancel.conf           (a machine)
# then: systemctl restart --user pipewire.service
#
# `libpipewire-module-echo-cancel` creates four nodes:
#
#   micro ─► capture ─►┌─────────────┐─► source   ─► LinuxHAL.audio_in
#                      │ echo-cancel │
#   LinuxHAL.audio_out ─► sink ─────►└─────────────┘─► playback ─► speaker
#
# `audio.out` MUST play into `sink` — that is the reference signal subtracted from
# the microphone; playing straight to the speaker leaves the AEC nothing to
# subtract. As shipped, the module captures the system's default source; to pin
# the HAT's microphone, uncomment and edit the ONE line below with the node name
# `pw-cli ls Node` reports (e.g. `alsa_input.platform-soc_sound...`). Wiring and
# the PortAudio/ALSA caveat: docs/spec/simulation_coverage.md §6.1.
context.modules = [
{   name = libpipewire-module-echo-cancel
    args = {
        library.name = "aec/libspa-aec-webrtc"
        node.description = "NeuroEdge Echo Cancel"
        capture.props  = { node.name = "neuroedge.ec.capture" }
        # target.object = "<the HAT I2S microphone, from `pw-cli ls Node`>"
        source.props   = { node.name = "neuroedge.ec.source" }
        sink.props     = { node.name = "neuroedge.ec.sink" }
        playback.props = { node.name = "neuroedge.ec.playback"
                           node.autoconnect = true }
    }
}
]
