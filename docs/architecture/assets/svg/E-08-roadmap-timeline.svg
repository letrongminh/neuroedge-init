<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="doneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="v1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="fleetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="740" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="738" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Header -->
  <g transform="translate(50, 25)">
    <rect x="0" y="0" width="1100" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="24" y="35" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">E-08 · NeuroEdge 19-Increment Architectural Evolution Roadmap (I0–I18)</text>
    <rect x="880" y="15" width="195" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="977" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">INCREMENT TIMELINE</text>
  </g>

  <!-- 4 PHASES SWIMLANES -->
  <g transform="translate(50, 95)">
    <!-- PHASE 1: AS-IS BASELINE (I0–I4) -->
    <g transform="translate(0, 0)">
      <rect width="1100" height="135" rx="12" fill="url(#doneGrad)" stroke="#16a34a" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="12" width="70" height="22" rx="4" fill="#15803d"/>
      <text x="51" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PHASE 1</text>
      <text x="96" y="28" font-size="13" font-weight="700" fill="#14532d">As-Is Baseline Architecture (Completed Increments I0–I4) · STATUS: DONE</text>

      <g transform="translate(16, 45)">
        <!-- I0 -->
        <rect x="0" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#15803d">I0 · Scaffolding</text>
        <text x="14" y="38" font-size="9" fill="#64748b">CLI entry · Directory map</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Test harness foundations</text>

        <!-- I1 -->
        <rect x="214" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#15803d">I1 · Typed Gates</text>
        <text x="14" y="38" font-size="9" fill="#64748b">Schema gate.v1 · P1/P2</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Extends merge $\le 3$ levels</text>

        <!-- I2 -->
        <rect x="428" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#15803d">I2 · Action CI</text>
        <text x="14" y="38" font-size="9" fill="#64748b">@action · TokenLedger</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Record &amp; Replay parity</text>

        <!-- I3 -->
        <rect x="642" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#15803d">I3 · System 2 &amp; MCP</text>
        <text x="14" y="38" font-size="9" fill="#64748b">LiteLLM cloud provider</text>
        <text x="14" y="52" font-size="9" fill="#64748b">MCP Host stdio IPC (Q-27)</text>

        <!-- I4 -->
        <rect x="856" y="0" width="210" height="72" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#15803d">I4 · Voice FSM &amp; QEMU</text>
        <text x="14" y="38" font-size="9" fill="#64748b">Barge-in FSM · C walker</text>
        <text x="14" y="52" font-size="9" fill="#64748b">NETR v1 on QEMU ESP32</text>
      </g>
    </g>

    <!-- PHASE 2: V1.0 CRITICAL PATH (I5–I7) -->
    <g transform="translate(0, 145)">
      <rect width="1100" height="135" rx="12" fill="url(#v1Grad)" stroke="#2563eb" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="12" width="70" height="22" rx="4" fill="#1d4ed8"/>
      <text x="51" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PHASE 2</text>
      <text x="96" y="28" font-size="13" font-weight="700" fill="#1e3a8a">v1.0 Production Release Critical Path (Increments I5–I7) · STATUS: IN PROGRESS</text>

      <g transform="translate(16, 45)">
        <!-- I5 -->
        <rect x="0" y="0" width="345" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
        <text x="16" y="22" font-size="11" font-weight="700" fill="#1e40af">I5 · Real-Time Voice on Chip</text>
        <text x="16" y="38" font-size="9" fill="#64748b">C99 Voice FSM on Core 1 · Audio DMA on Core 0</text>
        <text x="16" y="52" font-size="9" fill="#64748b">Opus WebSocket streaming to cloud AI provider</text>

        <!-- I6 -->
        <rect x="360" y="0" width="345" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
        <text x="16" y="22" font-size="11" font-weight="700" fill="#1e40af">I6 · Public Open Source Release</text>
        <text x="16" y="38" font-size="9" fill="#64748b">JSON schemas at `schema.neuroedge.dev`</text>
        <text x="16" y="52" font-size="9" fill="#64748b">SBOM + SLSA provenance · First PyPI release</text>

        <!-- I7 -->
        <rect x="720" y="0" width="345" height="72" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="16" y="22" font-size="11" font-weight="700" fill="#1d4ed8">I7 · Official v1.0 LTS Milestone</text>
        <text x="16" y="38" font-size="9" fill="#64748b">Signed Dual A/B OTA + Automatic Rollback</text>
        <text x="16" y="52" font-size="9" fill="#64748b">Secure Boot v2 + Flash Encryption · A1–A9 Complete</text>
      </g>
    </g>

    <!-- PHASE 3: FLEET & PLATFORM SCALING (I8–I13) -->
    <g transform="translate(0, 290)">
      <rect width="1100" height="135" rx="12" fill="url(#fleetGrad)" stroke="#9334e6" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="12" width="70" height="22" rx="4" fill="#7e22ce"/>
      <text x="51" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PHASE 3</text>
      <text x="96" y="28" font-size="13" font-weight="700" fill="#6b21a8">Fleet OS, Platform Scaling &amp; OEM Framework (Increments I8–I13) · POST-BETA</text>

      <g transform="translate(16, 45)">
        <!-- I8 -->
        <rect x="0" y="0" width="168" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#7e22ce">I8 · Beta Freeze</text>
        <text x="12" y="38" font-size="9" fill="#64748b">Freeze `1.0.x` line</text>
        <text x="12" y="52" font-size="9" fill="#64748b">Critical bugs only</text>

        <!-- I9 -->
        <rect x="178" y="0" width="170" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#7e22ce">I9 · Fleet OS</text>
        <text x="12" y="38" font-size="9" fill="#64748b">Canary OTA (Hawkbit)</text>
        <text x="12" y="52" font-size="9" fill="#64748b">Trace Vault 3-yr retain</text>

        <!-- I10 -->
        <rect x="358" y="0" width="170" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#7e22ce">I10 · Gate Registry</text>
        <text x="12" y="38" font-size="9" fill="#64748b">ORAS OCI signed packages</text>
        <text x="12" y="52" font-size="9" fill="#64748b">Sandbox (NFR-SEC-07)</text>

        <!-- I11 -->
        <rect x="538" y="0" width="170" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#7e22ce">I11 · Target Expansion</text>
        <text x="12" y="38" font-size="9" fill="#64748b">Tier 1/2/3 open enum</text>
        <text x="12" y="52" font-size="9" fill="#64748b">`board validate` tool</text>

        <!-- I12 -->
        <rect x="718" y="0" width="170" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#7e22ce">I12 · NeuroBrain</text>
        <text x="12" y="38" font-size="9" fill="#64748b">Hardware lab copilot</text>
        <text x="12" y="52" font-size="9" fill="#64748b">Invariant B-1 (Gated)</text>

        <!-- I13 -->
        <rect x="898" y="0" width="168" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#7e22ce">I13 · OEM Port Kit</text>
        <text x="12" y="38" font-size="9" fill="#64748b">Tier 3 5+3+1 contract</text>
        <text x="12" y="52" font-size="9" fill="#64748b">Compliance suite publish</text>
      </g>
    </g>

    <!-- PHASE 4: ROBOTICS & MULTIMODAL PERCEPTION (I14–I18) -->
    <g transform="translate(0, 435)">
      <rect width="1100" height="135" rx="12" fill="url(#robotGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="12" width="70" height="22" rx="4" fill="#b45309"/>
      <text x="51" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PHASE 4</text>
      <text x="96" y="28" font-size="13" font-weight="700" fill="#92400e">Tiered Robotics, Multimodal Perception &amp; Ecosystem (Increments I14–I18)</text>

      <g transform="translate(16, 45)">
        <!-- I14 -->
        <rect x="0" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#fde68a"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#92400e">I14 · Tiered Robotics</text>
        <text x="14" y="38" font-size="9" fill="#64748b">Zenoh-pico pub/sub wire</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Lease Token `motion.*` (200ms)</text>

        <!-- I15 -->
        <rect x="214" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#fde68a"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#92400e">I15 · Vision Primitive</text>
        <text x="14" y="38" font-size="9" fill="#64748b">RFC for `vision.in`</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Quantized facts via S1</text>

        <!-- I16 -->
        <rect x="428" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#fde68a"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#92400e">I16 · NVIDIA Jetson</text>
        <text x="14" y="38" font-size="9" fill="#64748b">Jetson Orin Nano Tier 2</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Real-time embedded VLM</text>

        <!-- I17 -->
        <rect x="642" y="0" width="202" height="72" rx="8" fill="#ffffff" stroke="#fde68a"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#92400e">I17 · Multimodal Voice+Vision</text>
        <text x="14" y="38" font-size="9" fill="#64748b">Unified State Machine</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Point &amp; command interaction</text>

        <!-- I18 -->
        <rect x="856" y="0" width="210" height="72" rx="8" fill="#ffffff" stroke="#fde68a"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#92400e">I18 · Ecosystem Scale</text>
        <text x="14" y="38" font-size="9" fill="#64748b">Multi-device SDKs</text>
        <text x="14" y="52" font-size="9" fill="#64748b">Free self-cert portal</text>
      </g>
