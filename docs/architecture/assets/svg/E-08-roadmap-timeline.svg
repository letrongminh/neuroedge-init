  <!-- LOWER METADATA BAR -->
  <g transform="translate(50, 585)">
    <rect width="1100" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#0f172a" text-transform="uppercase">Architectural Variation Principles Across Roadmap:</text>
    <text x="24" y="48" font-size="10" fill="#475569">1. <tspan font-weight="700" fill="#15803d">Zero Safety Compromise:</tspan> Scope-cut ladder level 5 rejected (ADR Q-42). Fail-closed default holds across all increments.</text>
    <text x="24" y="64" font-size="10" fill="#475569">2. <tspan font-weight="700" fill="#2563eb">Strict Separation of Concerns:</tspan> High-level AI models remain completely decoupled from real-time low-level safety reflexes.</text>
  </g>

  <!-- Footer Metadata Bar -->
  <g transform="translate(50, 715)">
    <text x="0" y="16" font-size="11" font-weight="600" fill="#64748b">NeuroEdge Roadmap Architecture · Schedule dates &amp; task IDs managed in PRD §0.2 · Technical variations modeled in `13-evolution-i0-i18.md`</text>
    <text x="1100" y="16" text-anchor="end" font-size="11" font-weight="500" fill="#94a3b8">Doc Ref: docs/architecture/vi/13-evolution-i0-i18.md</text>
  </g>
</svg>
