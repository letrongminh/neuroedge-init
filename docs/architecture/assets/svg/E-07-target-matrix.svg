<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="simGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="linuxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="698" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Header -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="1100" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="24" y="35" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">E-07 · Target Equivalence Implementation Matrix (5 Primitives × 3 Targets)</text>
    <rect x="850" y="15" width="225" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="962" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">TIER 1 EQUIVALENCE (P-2)</text>
  </g>

  <!-- MAIN MATRIX TABLE -->
  <g transform="translate(50, 105)">
    <rect width="1100" height="465" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Table Header Row -->
    <path d="M 0 14 Q 0 0 14 0 L 1086 0 Q 1100 0 1100 14 L 1100 48 L 0 48 Z" fill="#0f172a"/>
    <text x="120" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" text-transform="uppercase">5 Hardware Primitives</text>
    
    <text x="380" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">`sim` (Simulation)</text>
    <text x="380" y="38" text-anchor="middle" font-size="10" fill="#94a3b8">In-Memory Mock / Typed Text</text>

    <text x="660" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">`linux` (Host Linux OS)</text>
    <text x="660" y="38" text-anchor="middle" font-size="10" fill="#94a3b8">x86_64 / ARM64 Kernel Subsystems</text>

    <text x="950" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">`esp32s3` (Physical MCU)</text>
    <text x="950" y="38" text-anchor="middle" font-size="10" fill="#86efac">ESP32-S3-BOX-3 Reference Board</text>

    <!-- ROW 1: audio.in -->
    <g transform="translate(0, 48)">
      <rect width="240" height="80" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="24" y="34" font-size="13" font-weight="700" fill="#0f172a">audio.in</text>
      <text x="24" y="52" font-size="10" fill="#64748b">Acoustic Input &amp; VAD</text>

      <rect x="240" y="0" width="280" height="80" fill="url(#simGrad)" stroke="#bfdbfe"/>
      <text x="256" y="30" font-size="11" font-weight="700" fill="#1e40af">Mock PCM Buffer / Typed Text</text>
      <text x="256" y="48" font-size="9" fill="#475569">WAV raw files or typed commands</text>
      <text x="256" y="62" font-size="9" fill="#475569">Speech recognized instantly in RAM</text>

      <rect x="520" y="0" width="280" height="80" fill="url(#linuxGrad)" stroke="#cbd5e1"/>
      <text x="536" y="30" font-size="11" font-weight="700" fill="#334155">PipeWire / ALSA Stream</text>
      <text x="536" y="48" font-size="9" fill="#475569">Integrated PipeWire AEC Filter</text>
      <text x="536" y="62" font-size="9" fill="#475569">Microphone loopback in CI</text>

      <rect x="800" y="0" width="300" height="80" fill="url(#espGrad)" stroke="#bbf7d0"/>
      <text x="816" y="30" font-size="11" font-weight="700" fill="#166534">Dual ES7210 Codec via I2S DMA</text>
      <text x="816" y="48" font-size="9" fill="#475569">Hardware AEC on Core 0</text>
      <text x="816" y="62" font-size="9" fill="#475569">Voice Activity Energy Detection</text>
    </g>

    <!-- ROW 2: audio.out -->
    <g transform="translate(0, 128)">
      <rect width="240" height="80" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="24" y="34" font-size="13" font-weight="700" fill="#0f172a">audio.out</text>
      <text x="24" y="52" font-size="10" fill="#64748b">Audio Synthesis &amp; TTS</text>

      <rect x="240" y="0" width="280" height="80" fill="url(#simGrad)" stroke="#bfdbfe"/>
      <text x="256" y="30" font-size="11" font-weight="700" fill="#1e40af">Virtual Audio Sink</text>
      <text x="256" y="48" font-size="9" fill="#475569">Prints stdout text in terminal</text>
      <text x="256" y="62" font-size="9" fill="#475569">Duration timed by sample count</text>

      <rect x="520" y="0" width="280" height="80" fill="url(#linuxGrad)" stroke="#cbd5e1"/>
      <text x="536" y="30" font-size="11" font-weight="700" fill="#334155">PulseAudio / PipeWire Playback</text>
      <text x="536" y="48" font-size="9" fill="#475569">Outputs to system audio sink</text>
      <text x="536" y="62" font-size="9" fill="#475569">Software mute &lt; 300ms on barge-in</text>

      <rect x="800" y="0" width="300" height="80" fill="url(#espGrad)" stroke="#bbf7d0"/>
      <text x="816" y="30" font-size="11" font-weight="700" fill="#166534">ES8311 Codec + NS4150 Amp</text>
      <text x="816" y="48" font-size="9" fill="#475569">DMA RingBuffer on Core 0</text>
      <text x="816" y="62" font-size="9" fill="#475569">Instant FIFO flush on barge-in</text>
    </g>

    <!-- ROW 3: digital.out (CRITICAL GATED PATH) -->
    <g transform="translate(0, 208)">
      <rect width="240" height="85" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="24" y="34" font-size="13" font-weight="700" fill="#991b1b">digital.out</text>
      <text x="24" y="52" font-size="10" fill="#dc2626">Relay / Motor / Lock Actuation</text>
      <rect x="24" y="58" width="105" height="18" rx="3" fill="#dc2626"/>
      <text x="76" y="71" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">TOKEN GATED</text>

      <rect x="240" y="0" width="280" height="85" fill="url(#simGrad)" stroke="#bfdbfe"/>
      <text x="256" y="28" font-size="11" font-weight="700" fill="#1e40af">SimDigitalOut (RAM Array)</text>
      <text x="256" y="46" font-size="9" fill="#475569">Validates TokenLedger authorization</text>
      <text x="256" y="60" font-size="9" fill="#475569">Records pin state change to EventLog</text>

      <rect x="520" y="0" width="280" height="85" fill="url(#linuxGrad)" stroke="#cbd5e1"/>
      <text x="536" y="28" font-size="11" font-weight="700" fill="#334155">Linux `libgpiod` / `gpio-sim`</text>
      <text x="536" y="46" font-size="9" fill="#475569">Kernel sysfs / chardev pin control</text>
      <text x="536" y="60" font-size="9" fill="#475569">Enforces `authorize(token, pin)`</text>

      <rect x="800" y="0" width="300" height="85" fill="url(#espGrad)" stroke="#bbf7d0"/>
      <text x="816" y="28" font-size="11" font-weight="700" fill="#166534">ESP-IDF GPIO Driver (`gpio_set_level`)</text>
      <text x="816" y="46" font-size="9" fill="#475569">Physical Relay &amp; MOSFET driver</text>
      <text x="816" y="60" font-size="9" font-weight="700" fill="#dc2626">Bypass strictly prevented by HAL</text>
    </g>

    <!-- ROW 4: sensor.read -->
    <g transform="translate(0, 293)">
      <rect width="240" height="85" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="24" y="34" font-size="13" font-weight="700" fill="#0f172a">sensor.read</text>
      <text x="24" y="52" font-size="10" fill="#64748b">Environmental Telemetry</text>

      <rect x="240" y="0" width="280" height="85" fill="url(#simGrad)" stroke="#bfdbfe"/>
      <text x="256" y="28" font-size="11" font-weight="700" fill="#1e40af">SimSensorRead</text>
      <text x="256" y="46" font-size="9" fill="#475569">Configured via `[sim.sensors]`</text>
      <text x="256" y="60" font-size="9" fill="#475569">Injected directly to `engine.evaluate`</text>

      <rect x="520" y="0" width="280" height="85" fill="url(#linuxGrad)" stroke="#cbd5e1"/>
      <text x="536" y="28" font-size="11" font-weight="700" fill="#334155">Linux `hwmon` / `iio` Subsystem</text>
      <text x="536" y="46" font-size="9" fill="#475569">`i2c-stub` with LM75 / BMP280 in CI</text>
      <text x="536" y="60" font-size="9" fill="#475569">±2% measurement tolerance bound</text>

      <rect x="800" y="0" width="300" height="85" fill="url(#espGrad)" stroke="#bbf7d0"/>
      <text x="816" y="28" font-size="11" font-weight="700" fill="#166534">Hardware I2C / SPI Bus Driver</text>
      <text x="816" y="46" font-size="9" fill="#475569">SHTC3 temp/humidity &amp; ICM-42607 IMU</text>
      <text x="816" y="60" font-size="9" fill="#475569">Zero-copy sensor query loop</text>
    </g>

    <!-- ROW 5: display -->
    <g transform="translate(0, 378)">
      <rect width="240" height="85" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="24" y="34" font-size="13" font-weight="700" fill="#0f172a">display</text>
      <text x="24" y="52" font-size="10" fill="#64748b">Visual Feedback &amp; UI</text>

      <rect x="240" y="0" width="280" height="85" fill="url(#simGrad)" stroke="#bfdbfe"/>
      <text x="256" y="28" font-size="11" font-weight="700" fill="#1e40af">Virtual Framebuffer / Headless</text>
      <text x="256" y="46" font-size="9" fill="#475569">Renders PNG frames for visual diff</text>
      <text x="256" y="60" font-size="9" fill="#475569">Terminal UI in interactive run</text>

      <rect x="520" y="0" width="280" height="85" fill="url(#linuxGrad)" stroke="#cbd5e1"/>
      <text x="536" y="28" font-size="11" font-weight="700" fill="#334155">Linux Framebuffer (`/dev/fb0`)</text>
      <text x="536" y="46" font-size="9" fill="#475569">DRM / KMS or SDL2 test window</text>
      <text x="536" y="60" font-size="9" fill="#475569">Pixel diff verification</text>

      <rect x="800" y="0" width="300" height="85" fill="url(#espGrad)" stroke="#bbf7d0"/>
      <text x="816" y="28" font-size="11" font-weight="700" fill="#166534">2.4" SPI ST7789 Color LCD</text>
      <text x="816" y="46" font-size="9" fill="#475569">320 × 240 RGB565 via LVGL</text>
      <text x="816" y="60" font-size="9" fill="#475569">Direct DMA display flush</text>
    </g>
  </g>

  <!-- LOWER TIER COMMITMENT SUMMARY -->
  <g transform="translate(50, 585)">
    <rect width="1100" height="75" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="26" font-size="11" font-weight="700" fill="#0f172a" text-transform="uppercase">Target Tier Commitments (ADR Q-13 &amp; RFC-0002):</text>
    <text x="24" y="46" font-size="10" fill="#475569"><tspan font-weight="700" fill="#2563eb">Tier 1 (Core):</tspan> `sim`, `linux`, `esp32s3` (BOX-3) — 100% bitwise verdict parity on every PR · <tspan font-weight="700" fill="#d97706">Tier 2 (Reference):</tspan> STM32, Pico W, Jetson, ESP32-C6 — Verdict domain equivalence · <tspan font-weight="700" fill="#16a34a">Tier 3 (OEM):</tspan> Custom community boards via `fixtures/compliance/` self-verification suite.</text>
    <text x="24" y="62" font-size="10" font-weight="600" fill="#dc2626">Invariant 7: `sim-default` is NEVER permitted to offer more pins or richer capabilities than the physical Box-3 board.</text>
  </g>

  <!-- Footer Metadata Bar -->
  <g transform="translate(50, 680)">
    <text x="0" y="16" font-size="11" font-weight="600" fill="#64748b">NeuroEdge Target Equivalence Blueprint · Universal Logical Pin Set (KL-2) · Same Agent YAML, 100% Identical Verdict Sequences</text>
    <text x="1100" y="16" text-anchor="end" font-size="11" font-weight="500" fill="#94a3b8">Doc Ref: docs/architecture/vi/10-target-equivalence.md</text>
  </g>
</svg>
