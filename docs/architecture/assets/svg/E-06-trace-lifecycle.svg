<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPrimary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="698" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Header -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="1080" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="24" y="35" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">E-06 · Audit Trace Lifecycle: Record, Validate, Replay &amp; Golden Regression (DATA-06)</text>
    <rect x="880" y="15" width="176" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="968" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">RFC 8785 JCS AUDIT</text>
  </g>

  <!-- 4 HORIZONTAL PHASES OF TRACE LIFECYCLE -->
  <g transform="translate(60, 110)">
    <!-- PHASE 1: RECORD -->
    <g transform="translate(0, 0)">
      <rect width="250" height="420" rx="14" fill="url(#p1Grad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
      <path d="M 0 14 Q 0 0 14 0 L 236 0 Q 250 0 250 14 L 250 36 L 0 36 Z" fill="#2563eb"/>
      <text x="20" y="24" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.04em">1. RECORD (CAPTURE)</text>

      <g transform="translate(15, 50)">
        <rect width="220" height="60" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#1e3a8a">Live Session Emitter</text>
        <text x="12" y="42" font-size="9" fill="#64748b">EventLog collects all `emit()`</text>

        <rect y="72" width="220" height="65" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#1e3a8a">UART NE1 Stream</text>
        <text x="12" y="40" font-size="9" fill="#64748b">Framing: `NE1 {JSON}` \n</text>
        <text x="12" y="54" font-size="9" fill="#64748b">Line buffer $\le$ 512 Bytes</text>

        <rect y="150" width="220" height="75" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#1e3a8a">Source Anonymization</text>
        <text x="12" y="38" font-size="9" fill="#64748b">Decision-preserving hash</text>
        <text x="12" y="52" font-size="9" fill="#64748b">PII stripped at emission point</text>
        <text x="12" y="66" font-size="9" font-weight="600" fill="#2563eb">RFC 8785 Canonical JSON</text>

        <!-- Artifact Box -->
        <rect y="240" width="220" height="95" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="110" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">traces/&lt;sess&gt;.json</text>
        <text x="110" y="44" text-anchor="middle" font-size="9" fill="#475569">Metadata: git commit, agent_v,</text>
        <text x="110" y="58" text-anchor="middle" font-size="9" fill="#475569">target, board_id, build_digest</text>
        <rect x="20" y="68" width="180" height="18" rx="4" fill="#2563eb"/>
        <text x="110" y="81" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">IMMUTABLE EVIDENCE</text>
      </g>
    </g>

    <path d="M 255 310 L 275 310" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowPrimary)"/>

    <!-- PHASE 2: VALIDATE -->
    <g transform="translate(280, 0)">
      <rect width="250" height="420" rx="14" fill="url(#p2Grad)" stroke="#c084fc" stroke-width="1.5" filter="url(#cardShadow)"/>
      <path d="M 0 14 Q 0 0 14 0 L 236 0 Q 250 0 250 14 L 250 36 L 0 36 Z" fill="#9334e6"/>
      <text x="20" y="24" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.04em">2. VALIDATE (LINT)</text>

      <g transform="translate(15, 50)">
        <rect width="220" height="60" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#7e22ce">Schema Validation</text>
        <text x="12" y="42" font-size="9" fill="#64748b">Check `trace.v1.json` Draft</text>

        <rect y="72" width="220" height="70" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#7e22ce">Span Chronology</text>
        <text x="12" y="40" font-size="9" fill="#64748b">Monotonic offset_ms check</text>
        <text x="12" y="56" font-size="9" fill="#64748b">6 Event groups structured</text>

        <rect y="155" width="220" height="70" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#7e22ce">Cryptographic Integrity</text>
        <text x="12" y="40" font-size="9" fill="#64748b">Verify gate_digest SHA-256</text>
        <text x="12" y="56" font-size="9" fill="#64748b">Token nonce entropy check</text>

        <!-- Pass/Fail Badge -->
        <rect y="240" width="220" height="95" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
        <text x="110" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Schema Compliance</text>
        <text x="110" y="46" text-anchor="middle" font-size="9" fill="#64748b">Malformed trace or bad offsets $\to$</text>
        <rect x="20" y="60" width="180" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/>
        <text x="110" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Raises NE4001</text>
      </g>
    </g>

    <path d="M 535 310 L 555 310" stroke="#9334e6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- PHASE 3: REPLAY -->
    <g transform="translate(560, 0)">
      <rect width="250" height="420" rx="14" fill="url(#p3Grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
      <path d="M 0 14 Q 0 0 14 0 L 236 0 Q 250 0 250 14 L 250 36 L 0 36 Z" fill="#d97706"/>
      <text x="20" y="24" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.04em">3. REPLAY (RE-EVALUATE)</text>

      <g transform="translate(15, 50)">
        <rect width="220" height="65" rx="6" fill="#ffffff" stroke="#fde68a"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#92400e">No Blind Trust</text>
        <text x="12" y="42" font-size="9" fill="#64748b">Replay NEVER copies verdicts!</text>
        <text x="12" y="56" font-size="9" font-weight="600" fill="#b45309">Re-evaluates from raw facts</text>

        <rect y="78" width="220" height="65" rx="6" fill="#ffffff" stroke="#fde68a"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#92400e">Active Gate Execution</text>
        <text x="12" y="40" font-size="9" fill="#64748b">Feeds recorded facts to walker</text>
        <text x="12" y="54" font-size="9" fill="#64748b">Checks current policy tree</text>

        <rect y="155" width="220" height="70" rx="6" fill="#ffffff" stroke="#fde68a"/>
        <text x="12" y="24" font-size="11" font-weight="700" fill="#92400e">Live HAL Actuation Check</text>
        <text x="12" y="40" font-size="9" fill="#64748b">Re-executes pins on SimHAL /</text>
        <text x="12" y="56" font-size="9" fill="#64748b">gpiod / QEMU target</text>

        <!-- Fresh Trace Box -->
        <rect y="240" width="220" height="95" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="110" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">replayed_trace.json</text>
        <text x="110" y="46" text-anchor="middle" font-size="9" fill="#64748b">Newly minted verdict sequence &amp;</text>
        <text x="110" y="60" text-anchor="middle" font-size="9" fill="#64748b">actual physical pin commands</text>
        <rect x="20" y="68" width="180" height="18" rx="4" fill="#d97706"/>
        <text x="110" y="81" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">RE-COMPUTED VERDICTS</text>
      </g>
    </g>

    <path d="M 815 310 L 835 310" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- PHASE 4: GOLDEN VERIFY -->
    <g transform="translate(840, 0)">
      <rect width="240" height="420" rx="14" fill="url(#p4Grad)" stroke="#16a34a" stroke-width="2" filter="url(#cardShadow)"/>
      <path d="M 0 14 Q 0 0 14 0 L 226 0 Q 240 0 240 14 L 240 36 L 0 36 Z" fill="#15803d"/>
      <text x="20" y="24" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.04em">4. GOLDEN VERIFY</text>

      <g transform="translate(15, 50)">
        <rect width="210" height="65" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#14532d">Filter Non-Safety Noise</text>
        <text x="12" y="38" font-size="9" fill="#64748b">Strips wall-clock time &amp; jitter</text>
        <text x="12" y="52" font-size="9" fill="#64748b">Ignores free LLM phrasing</text>

        <rect y="78" width="210" height="75" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#14532d">Exact Golden Comparison</text>
        <text x="12" y="38" font-size="9" fill="#166534">1. Gate Verdicts: ALLOW / BLOCK</text>
        <text x="12" y="52" font-size="9" fill="#166534">2. Pin Sequence: Pin &amp; Logic Level</text>
        <text x="12" y="66" font-size="9" fill="#166534">3. Reason Codes: Match 100%</text>

        <!-- Outcome Cards -->
        <rect y="165" width="210" height="75" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
        <text x="105" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">PERFECT BITWISE MATCH</text>
        <text x="105" y="42" text-anchor="middle" font-size="9" fill="#166534">Zero safety drift across targets</text>
        <rect x="25" y="48" width="160" height="18" rx="3" fill="#15803d"/>
        <text x="105" y="61" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">CI BUILD: PASS (Tier 1)</text>

        <rect y="250" width="210" height="85" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="105" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">SAFETY REGRESSION</text>
        <text x="105" y="42" text-anchor="middle" font-size="9" fill="#dc2626">BLOCK turned into ALLOW or extra pin</text>
        <rect x="25" y="52" width="160" height="22" rx="4" fill="#dc2626"/>
        <text x="105" y="67" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">RAISE NE4002 (FATAL)</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM COMPARISON SUMMARY BOX -->
  <g transform="translate(60, 555)">
    <rect width="1080" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="28" font-size="12" font-weight="700" fill="#0f172a" text-transform="uppercase">Target Differential Comparison Oracle (Invariant P-2 &amp; FR-TGT-04)</text>
    <text x="24" y="50" font-size="11" fill="#475569">The Golden Trace suite (`fixtures/golden_traces/`) contains normative session artifacts. Replaying the identical trace across `sim` (Python), `linux` (Python), and `esp32s3` (C99 Walker) MUST yield the identical verdict sequence.</text>
    <rect x="24" y="64" width="240" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="144" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Happy Path: All Criteria Pass</text>
    <rect x="280" y="64" width="260" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="410" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Unverified Attempt: Blocked at Gate</text>
    <rect x="556" y="64" width="260" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="686" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Network Offline: Safe Fallback Gate</text>
  </g>

  <!-- Footer Metadata Bar -->
  <g transform="translate(60, 675)">
    <text x="0" y="16" font-size="11" font-weight="600" fill="#64748b">NeuroEdge Audit Trace Architecture · Editing Golden Traces strictly requires an RFC and digests.lock update (CONTRIBUTING.md §3)</text>
    <text x="1080" y="16" text-anchor="end" font-size="11" font-weight="500" fill="#94a3b8">Doc Ref: docs/architecture/vi/06-runtime-flows.md</text>
  </g>
</svg>
