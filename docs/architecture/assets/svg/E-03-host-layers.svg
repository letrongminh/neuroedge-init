<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="l0Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="l3sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="l3cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="718" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Header -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="1080" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">E-03 · Host Python Component Layering &amp; Import Boundaries (C4 L3)</text>
    <rect x="870" y="16" width="190" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="965" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">HEXAGONAL ARCHITECTURE</text>
  </g>

  <!-- LAYER 0: Entrypoint & Assemblers -->
  <g transform="translate(60, 105)">
    <rect width="1080" height="64" rx="10" fill="url(#l0Grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="70" height="22" rx="4" fill="#d97706"/>
    <text x="51" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">LAYER 0</text>
    <text x="96" y="30" font-size="14" font-weight="700" fill="#92400e">Entry &amp; Assembly Surface</text>
    <text x="96" y="48" font-size="11" fill="#78350f">CLI (`cli.py` via Typer) · Simulation Session (`session.py` assembler) · Stdio MCP Server · Web REPL</text>
    <rect x="880" y="20" width="180" height="24" rx="6" fill="#fef3c7" stroke="#fde68a"/>
    <text x="970" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Sole Assembler Hub</text>
  </g>

  <!-- LAYER 3 SURFACE: Actions & Tokens (The Sole Bridge) -->
  <g transform="translate(60, 185)">
    <rect width="1080" height="74" rx="10" fill="url(#l3sGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="70" height="22" rx="4" fill="#2563eb"/>
    <text x="51" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">L3 BRIDGE</text>
    <text x="96" y="30" font-size="14" font-weight="700" fill="#1e40af">actions/ — Action Interface &amp; Token Authority (The ONLY Bridge)</text>
    <text x="96" y="52" font-size="11" fill="#3b82f6">`@action` decorator · `c.do()` (Gated physical effect) · `c.say()` (Conversational audio) · `TokenLedger` (Single-use Token Minting)</text>
    <rect x="860" y="22" width="200" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="960" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">No Direct HAL Bypass Allowed</text>
  </g>

  <!-- MIDDLE ROW: Core Engine vs Peripheral HAL -->
  <g transform="translate(60, 275)">
    <!-- LEFT: L3 CORE ENGINE -->
    <g transform="translate(0, 0)">
      <rect width="525" height="175" rx="12" fill="url(#l3cGrad)" stroke="#ef4444" stroke-width="2" filter="url(#cardShadow)"/>
      <rect x="16" y="14" width="75" height="22" rx="4" fill="#dc2626"/>
      <text x="53" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">L3 CORE</text>
      <text x="100" y="30" font-size="14" font-weight="700" fill="#991b1b">engine/ — Policy &amp; Safety Gate Core</text>
      <text x="16" y="52" font-size="11" fill="#7f1d1d">Inviolable rule engine: Never imports HAL, actions, or sim</text>

      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="154" height="44" rx="6" fill="#ffffff" stroke="#fca5a5"/>
        <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">gate.py</text>
        <text x="77" y="34" text-anchor="middle" font-size="9" fill="#64748b">evaluate() · CircuitBreaker</text>

        <rect x="166" y="0" width="154" height="44" rx="6" fill="#ffffff" stroke="#fca5a5"/>
        <text x="243" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">gate_resolver.py</text>
        <text x="243" y="34" text-anchor="middle" font-size="9" fill="#64748b">Extends merge · P1/P2</text>

        <rect x="332" y="0" width="154" height="44" rx="6" fill="#ffffff" stroke="#fca5a5"/>
        <text x="409" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">binary_tree.py</text>
        <text x="409" y="34" text-anchor="middle" font-size="9" fill="#64748b">NETR v1 encoder (RFC-0003)</text>

        <rect x="0" y="52" width="240" height="44" rx="6" fill="#ffffff" stroke="#fca5a5"/>
        <text x="120" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">decision_tree.py</text>
        <text x="120" y="86" text-anchor="middle" font-size="9" fill="#64748b">Criteria compilation &amp; domain index</text>

        <rect x="250" y="52" width="236" height="44" rx="6" fill="#ffffff" stroke="#fca5a5"/>
        <text x="368" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">constraints.py</text>
        <text x="368" y="86" text-anchor="middle" font-size="9" fill="#64748b">RFC-0005 argument range check</text>
      </g>
    </g>

    <!-- RIGHT: L1 HARDWARE ABSTRACTION LAYER (HAL) -->
    <g transform="translate(555, 0)">
      <rect width="525" height="175" rx="12" fill="url(#l1Grad)" stroke="#16a34a" stroke-width="2" filter="url(#cardShadow)"/>
      <rect x="16" y="14" width="75" height="22" rx="4" fill="#16a34a"/>
      <text x="53" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">L1 HAL</text>
      <text x="100" y="30" font-size="14" font-weight="700" fill="#166534">hal/ — Closed Hardware Abstraction</text>
      <text x="16" y="52" font-size="11" fill="#14532d">5 Closed primitives: Never imports engine, only authorizes Token</text>

      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="154" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">board.py</text>
        <text x="77" y="34" text-anchor="middle" font-size="9" fill="#64748b">board.toml parser (DATA-01)</text>

        <rect x="166" y="0" width="154" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="243" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">sim.py</text>
        <text x="243" y="34" text-anchor="middle" font-size="9" fill="#64748b">SimHAL mock in RAM</text>

        <rect x="332" y="0" width="154" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="409" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">linux.py</text>
        <text x="409" y="34" text-anchor="middle" font-size="9" fill="#64748b">gpiod · hwmon · fbdev</text>

        <rect x="0" y="52" width="240" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="120" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">refuse_all.py</text>
        <text x="120" y="86" text-anchor="middle" font-size="9" fill="#64748b">Default closed fallback actuator</text>

        <rect x="250" y="52" width="236" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="368" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">token_guard.py</text>
        <text x="368" y="86" text-anchor="middle" font-size="9" fill="#64748b">authorize(token, pin) gatekeeper</text>
      </g>
    </g>
  </g>

  <!-- LOWER ROW: Models & Observability -->
  <g transform="translate(60, 465)">
    <!-- LEFT: L2 MODELS & PERCEPTION -->
    <g transform="translate(0, 0)">
      <rect width="525" height="125" rx="12" fill="url(#l2Grad)" stroke="#a855f7" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="14" width="75" height="22" rx="4" fill="#9334e6"/>
      <text x="53" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">L2 INTEL</text>
      <text x="100" y="30" font-size="14" font-weight="700" fill="#6b21a8">models/ &amp; voice/ — Perception &amp; AI Routing</text>
      <text x="16" y="50" font-size="11" fill="#581c87">System 1 (Grammar trie &lt;50ms) · System 2 (LiteLLM Cloud) · Voice FSM (Barge-in &lt;20ms)</text>

      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="154" height="45" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">voice/fsm.py</text>
        <text x="77" y="34" text-anchor="middle" font-size="9" fill="#64748b">14 Voice States</text>

        <rect x="166" y="0" width="154" height="45" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="243" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">system_one/</text>
        <text x="243" y="34" text-anchor="middle" font-size="9" fill="#64748b">Grammar fallback</text>

        <rect x="332" y="0" width="154" height="45" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="409" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">providers/</text>
        <text x="409" y="34" text-anchor="middle" font-size="9" fill="#64748b">LiteLLM wrapper</text>
      </g>
    </g>

    <!-- RIGHT: OBSERVABILITY & TESTING -->
    <g transform="translate(555, 0)">
      <rect width="525" height="125" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="14" width="75" height="22" rx="4" fill="#b45309"/>
      <text x="53" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">AUDIT</text>
      <text x="100" y="30" font-size="14" font-weight="700" fill="#92400e">testing/ — Telemetry &amp; Regression Verification</text>
      <text x="16" y="50" font-size="11" fill="#78350f">EventLog · JCS canonical serialization · Golden diffing (NE4002) · Memory probe</text>

      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="154" height="45" rx="6" fill="#ffffff" stroke="#fde68a"/>
        <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">trace.py</text>
        <text x="77" y="34" text-anchor="middle" font-size="9" fill="#64748b">trace.v1 schema</text>

        <rect x="166" y="0" width="154" height="45" rx="6" fill="#ffffff" stroke="#fde68a"/>
        <text x="243" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">golden.py</text>
        <text x="243" y="34" text-anchor="middle" font-size="9" fill="#64748b">Verdict parity check</text>

        <rect x="332" y="0" width="154" height="45" rx="6" fill="#ffffff" stroke="#fde68a"/>
        <text x="409" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">recorder.py</text>
        <text x="409" y="34" text-anchor="middle" font-size="9" fill="#64748b">Live session replay</text>
      </g>
    </g>
  </g>

  <!-- LAYER FOUNDATION: Shared Infrastructure -->
  <g transform="translate(60, 605)">
    <rect width="1080" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="32" font-size="12" font-weight="700" fill="#334155" text-transform="uppercase">Foundation Layer:</text>
    <text x="160" y="32" font-size="12" fill="#475569">`errors.py` (3-part NE1001…NE5001) · `paths.py` · `schemas/` (JSON draft 2020-12) · `fixtures/` · Zero outgoing dependencies</text>
  </g>

  <!-- Connective Arrows Representing Import Constraints -->
  <!-- actions to engine -->
  <path d="M 400 260 L 320 275" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <!-- actions to hal -->
  <path d="M 800 260 L 820 275" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer Metadata Bar -->
  <g transform="translate(60, 685)">
    <text x="0" y="16" font-size="11" font-weight="600" fill="#64748b">Strict Architectural Invariant: `engine` NEVER imports `actions` or `hal` · `hal` NEVER imports `engine` · `session.py` is the sole assembler</text>
    <text x="1080" y="16" text-anchor="end" font-size="11" font-weight="500" fill="#94a3b8">Doc Ref: docs/architecture/vi/03-component-host-c4l3.md</text>
  </g>
</svg>
