# gitleaks configuration — .github/workflows/security.yml scans the WHOLE history.
# False positives are allowlisted here, one reason per entry; a real secret is never
# allowlisted: rotate it, then decide on a history rewrite.

[extend]
useDefault = true

[[allowlists]]
description = """
python/tests/test_studio_server.py (commit d968c07): a made-up OpenRouter-shaped value that
the test puts in the environment to prove the studio redacts it from subprocess output
(TSK-I1-04). It was never a key.
"""
regexes = ['''sk-or-v1-0123456789abcdef''']

[[allowlists]]
description = """
python/tests/test_vision_model.py (commit aed1e60): a made-up key-shaped value the test puts in
a `[vision]` table to prove the loader refuses secrets in agent.toml and never echoes them
(TSK-V1b-03). It was never a key.
"""
regexes = ['''sk-live-1234567890abcdef''']

[[allowlists]]
description = """
python/tests/test_guard.py (TSK-I2c-07): a made-up key-shaped value the test writes into a
guard.toml tool parameter to prove the loader refuses a literal secret and never echoes it
(RFC-0016 §3b). It was never a key.
"""
regexes = ['''sk-abcdef0123456789''']
